<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEMOGRACINHA</title>
<meta name="theme-color" content="#0B1F3A">
<style>
/* == UI == (estilos) Sistema visual "Plano Piloto: Dossiê e Palanque" (D79, GDD 6): travertino, marfim, latão fosco e azul cívico.
   Todo par de texto e fundo listado em tests/ui tem contraste de pelo menos 4,5:1. */
:root {
  --bg-outer: #0F172A; --bg-mesa: #EAE5DC; --bg-card: #FAF8F4; --bg-subtle: #EFECE6; --branco: #FFFFFF;
  --border-card: #857C6C; /* 3:1 com a mesa e o cartão (WCAG 1.4.11, controles) */ --brass: #B08D57; --brass-dark: #755627;
  --civic-navy: #0B1F3A; --civic-blue: #134074; --civic-blue-hover: #0B2545; --civic-tint: #E6EFF8;
  --ink-primary: #141B24; --ink-secondary: #2F3A4A; --ink-inverse: #F8FAFC;
  --hud-bg: #0B1F3A; --hud-label: #E2E8F0; --hud-accent: #FDE68A;
  --good-bg: #E6F4EC; --good-ink: #114226; --good-border: #8CC7A3;
  --warn-bg: #FEF3DC; --warn-ink: #7A3E00; --warn-border: #E5B96F;
  --bad-bg: #FCE8E8; --bad-ink: #821D1D; --bad-border: #E39B9B;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1); --dur-fast: 180ms; --dur-tactile: 280ms; --dur-med: 340ms;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg-outer); color: var(--ink-primary);
  font-family: var(--font-sans); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Moldura 360 px */
.viewport-shell { width: 100%; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
@media (min-width: 420px) { .viewport-shell { padding: 16px 0 32px; } }
.phone-frame { width: 100%; max-width: 360px; min-height: 100vh; background-color: var(--bg-mesa);
  background-image: radial-gradient(circle at 12px 12px, rgba(19, 64, 116, 0.045) 2px, transparent 2.5px),
    linear-gradient(45deg, rgba(176, 141, 87, 0.045) 25%, transparent 25%, transparent 75%, rgba(176, 141, 87, 0.045) 75%);
  background-size: 24px 24px; position: relative; overflow-x: hidden; display: flex; flex-direction: column; }
@media (min-width: 420px) { .phone-frame { min-height: 760px; border-radius: 22px; box-shadow: 0 24px 56px rgba(0, 0, 0, 0.6); border: 1px solid rgba(176, 141, 87, 0.55); } }

/* Plano 0: horizonte de Brasília */
.sky-stage { position: relative; width: 100%; height: 166px; background: #102A4C; overflow: hidden; flex-shrink: 0;
  transition: height var(--dur-med) var(--ease); border-bottom: 2px solid var(--brass); }
.sky-stage.is-hero { height: 230px; }
#sky-gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.parallax-layer { position: absolute; left: 0; bottom: 0; width: 100%; pointer-events: none; transition: height var(--dur-med) var(--ease), transform 110ms linear; }
.layer-far { height: 94px; opacity: 0.48; z-index: 1; } .layer-mid { height: 108px; opacity: 0.82; z-index: 2; } .layer-fg { height: 124px; z-index: 3; }
.sky-stage.is-hero .layer-far { height: 128px; } .sky-stage.is-hero .layer-mid { height: 146px; } .sky-stage.is-hero .layer-fg { height: 170px; }
.plaza-group { opacity: 0; transform: translateY(4px); transition: opacity var(--dur-med) var(--ease), transform var(--dur-med) var(--ease); }
.sky-stage[data-street="discreta"] .plaza-discreta, .sky-stage[data-street="popular"] .plaza-popular, .sky-stage[data-street="hostil"] .plaza-hostil { opacity: 1; transform: translateY(0); }
.flag-wave { transform-box: fill-box; transform-origin: left center; animation: flagFlutter 2.4s ease-in-out infinite alternate; }
.flag-wave-delay { animation-delay: 0.65s; }
@keyframes flagFlutter { from { transform: skewY(-2deg) scaleX(0.95); } to { transform: skewY(3deg) scaleX(1.04); } }
.water-gold-glow { opacity: 0; transition: opacity var(--dur-med) var(--ease); }
.sky-stage[data-street="popular"] .water-gold-glow { opacity: 0.38; }
.top-chrome { position: relative; z-index: 4; padding: 12px; display: flex; align-items: center; }
.brand-lockup { display: inline-flex; align-items: center; gap: 7px; background: rgba(9, 24, 46, 0.92); border: 1px solid rgba(255, 255, 255, 0.22); padding: 6px 10px; border-radius: 999px; color: #FFFFFF; margin: 0; }
.brand-title { font-size: 11.5px; font-weight: 800; letter-spacing: 0.08em; }

/* Plano 1: painel de situação */
.hud-anchor { position: relative; z-index: 5; margin: -26px 12px 0; background: rgba(11, 31, 58, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(176, 141, 87, 0.65); border-radius: 14px; padding: 10px 12px; color: var(--ink-inverse); box-shadow: 0 10px 24px rgba(11, 31, 58, 0.24); }
.hud-anchor[hidden] { display: none; }
.hud-context-row { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.16); font-size: 11px; }
.hud-turn { font-weight: 800; color: var(--hud-accent); letter-spacing: 0.02em; } .hud-role { color: #F1F5F9; font-weight: 600; }
.hud-grid-metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 0; }
.hud-grid-metrics.has-extra { grid-template-columns: repeat(3, 1fr); }
.metric-cell { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.metric-label { display: block; font-size: 10.5px; font-weight: 600; line-height: 1.2; color: var(--hud-label); overflow-wrap: normal; }
.metric-val { display: block; font-size: 13.5px; font-weight: 800; font-variant-numeric: tabular-nums; color: #FFFFFF; margin: 1px 0 0; }
.opinion-bar { margin-top: 8px; height: 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.18); overflow: hidden; display: flex; gap: 1px; }
.op-seg-pop { background: #34D399; transition: width var(--dur-med) var(--ease); } .op-seg-neu { background: #CBD5E1; transition: width var(--dur-med) var(--ease); }
.op-seg-rej { background: #F87171; transition: width var(--dur-med) var(--ease); }
.hud-legend { margin: 5px 0 0; font-size: 10.5px; color: var(--hud-label); }

/* Plano 2: mesa de despacho */
.desk { flex: 1; padding: 12px 12px 24px; display: flex; flex-direction: column; gap: 12px; }
.desk:focus { outline: none; }
.desk.is-hero-desk { margin-top: -28px; position: relative; z-index: 5; }
.fase { display: flex; flex-direction: column; gap: 12px; }
.phase-enter { animation: phaseSlideIn var(--dur-med) var(--ease) both; }
@keyframes phaseSlideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
.dossier-card { position: relative; background: var(--bg-card); border: 1px solid var(--border-card); border-top: 3px solid var(--civic-blue); border-radius: 14px; padding: 14px; box-shadow: 0 4px 14px rgba(20, 27, 36, 0.08); overflow: hidden; }
.dossier-banner { position: relative; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border-card); }
.dossier-watermark { position: absolute; right: -4px; top: -6px; width: 54px; height: 54px; color: var(--brass-dark); opacity: 0.14; pointer-events: none; }
.dossier-proto-line { position: relative; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
.dossier-kicker { margin: 0; font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: 0.05em; color: var(--brass-dark); text-transform: uppercase; }
.step-counter { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; color: var(--civic-blue); background: var(--civic-tint); border: 1px solid rgba(19, 64, 116, 0.24); padding: 2px 7px; border-radius: 999px; }
.street-rubric { display: inline-flex; align-items: center; font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 6px; }
.rubric-discreta { background: var(--bg-subtle); color: var(--ink-secondary); border: 1px solid var(--border-card); }
.rubric-popular { background: var(--good-bg); color: var(--good-ink); border: 1px solid var(--good-border); }
.rubric-hostil { background: var(--bad-bg); color: var(--bad-ink); border: 1px solid var(--bad-border); }
.dossier-title { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.25; color: var(--ink-primary); }
.dossier-title:focus { outline: none; } /* foco só para leitores de tela: o título não é controle */
.dossier-subtitle { margin: 3px 0 0; font-size: 13px; font-weight: 600; color: var(--ink-secondary); }
.secao { font-size: 14px; margin: 12px 0 6px; }
.context-tip { background: var(--civic-tint); border: 1px solid rgba(19, 64, 116, 0.24); border-left: 3px solid var(--civic-blue); color: var(--civic-navy); border-radius: 9px; padding: 8px 10px; font-size: 12.5px; font-weight: 600; line-height: 1.4; margin: 0 0 11px; }
.fiction-notice { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-ink); border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 700; margin: 10px 0 14px; }
.erro { background: var(--bad-bg); border: 1px solid var(--bad-border); color: var(--bad-ink); border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 700; margin: 0; }

/* Cartões selecionáveis: seleção no lugar, sem reconstruir o DOM */
.hand-stack { display: flex; flex-direction: column; gap: 10px; }
.tactic-card { position: relative; background: var(--bg-card); border: 1.5px solid var(--border-card); border-radius: 14px; padding: 12px; cursor: pointer; min-height: 48px;
  box-shadow: 0 3px 10px rgba(20, 27, 36, 0.06); user-select: none; -webkit-tap-highlight-color: transparent;
  transition: transform var(--dur-tactile) var(--ease), border-color var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease), box-shadow var(--dur-tactile) var(--ease); }
.tactic-card:active { transform: scale(0.988); }
.tactic-card:focus-visible { outline: 3px solid var(--civic-blue); outline-offset: 2px; }
.tactic-card[aria-disabled="true"] { cursor: not-allowed; background: var(--bg-subtle); border-style: dashed; }
.tactic-card.is-selected { background: var(--branco); border-color: var(--civic-blue);
  box-shadow: 0 0 0 2px var(--civic-blue), inset 0 0 0 1px rgba(176, 141, 87, 0.55), 0 10px 22px rgba(19, 64, 116, 0.16); transform: translateY(-2px); }
.card-suit-bar { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
.suit-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--civic-blue); }
.cost-pill { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--bg-subtle); color: var(--ink-primary); border: 1px solid var(--border-card); }
.cost-pill.is-safe { background: var(--good-bg); color: var(--good-ink); border-color: var(--good-border); }
.card-title { margin: 0 0 4px; font-size: 15.5px; font-weight: 800; color: var(--ink-primary); }
.card-desc { margin: 0 0 9px; font-size: 13.5px; color: var(--ink-secondary); }
.chip-row { display: flex; flex-wrap: wrap; gap: 5px; }
.impact-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 7px; border: 1px solid transparent; }
.chip-good { background: var(--good-bg); color: var(--good-ink); border-color: var(--good-border); }
.chip-warn { background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-border); }
.chip-bad { background: var(--bad-bg); color: var(--bad-ink); border-color: var(--bad-border); }
.chip-neu { background: var(--bg-subtle); color: var(--ink-secondary); border-color: var(--border-card); }
.selected-ribbon { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--border-card); display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 800; color: var(--civic-blue); }
.par-escolha { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.par-escolha .tactic-card { padding: 10px; text-align: center; font-weight: 800; }
.ficha-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin: 8px 0; }
.ficha-item { background: var(--bg-subtle); border: 1px solid var(--border-card); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.ficha-k { display: block; font-size: 11px; font-weight: 700; color: var(--ink-secondary); }
.ficha-v { display: block; font-size: 13px; font-weight: 800; color: var(--ink-primary); margin-top: 1px; }
.resumo-item { background: var(--branco); border: 1px solid var(--border-card); border-radius: 8px; padding: 8px 10px; }
.resumo-item ul { margin: 4px 0 0; padding-left: 18px; font-size: 13.5px; }
.resumo-item p { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-secondary); }

/* Botões e campos (alvos de 48 px) */
.btn { appearance: none; width: 100%; min-height: 48px; padding: 12px 16px; border-radius: 11px; font-family: var(--font-sans); font-size: 14.5px; font-weight: 800; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px solid transparent;
  transition: transform var(--dur-fast) var(--ease), background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
.btn:active { transform: scale(0.985); }
.btn:focus-visible { outline: 3px solid var(--civic-blue); outline-offset: 2px; }
.btn-primary { background: var(--civic-blue); color: #FFFFFF; border-color: var(--civic-navy); box-shadow: 0 4px 12px rgba(19, 64, 116, 0.24); }
.btn-primary:hover { background: var(--civic-blue-hover); }
.btn-primary:disabled { background: var(--bg-subtle); color: var(--ink-secondary); border: 1.5px dashed var(--border-card); box-shadow: none; cursor: not-allowed; }
.btn-secondary { background: var(--bg-card); color: var(--ink-primary); border-color: var(--border-card); }
.btn-secondary:hover { background: var(--bg-subtle); }
.btn-stack { display: flex; flex-direction: column; gap: 8px; }
.field-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field-label { font-size: 13px; font-weight: 800; color: var(--ink-primary); }
.field-input, .field-select, .field-textarea { width: 100%; min-height: 48px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--border-card); background: var(--branco); color: var(--ink-primary); font-family: var(--font-sans); font-size: 14.5px; }
.field-textarea { min-height: 88px; font-family: var(--font-mono); font-size: 12px; resize: vertical; }
.field-input:focus, .field-select:focus, .field-textarea:focus { outline: 2px solid var(--civic-blue); border-color: var(--civic-blue); }
.radio-pill-group { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.choice-box { min-height: 48px; border: 1.5px solid var(--border-card); background: var(--branco); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 700; cursor: pointer; padding: 6px; text-align: center; color: var(--ink-primary);
  transition: background-color var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease); }
.choice-box:focus-visible { outline: 3px solid var(--civic-blue); outline-offset: 2px; }
.choice-box[aria-checked="true"] { background: var(--civic-tint); border-color: var(--civic-blue); color: var(--civic-blue); box-shadow: 0 0 0 1px var(--civic-blue); }

/* Carimbo de registro */
.stamp-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(11, 31, 58, 0.44); display: flex; align-items: center; justify-content: center; pointer-events: none; opacity: 0; transition: opacity var(--dur-fast) var(--ease); }
.stamp-overlay.is-visible { opacity: 1; }
.stamp-box { background: var(--bg-card); border: 3px solid var(--civic-blue); outline: 2px solid var(--brass); outline-offset: -6px; color: var(--civic-blue); padding: 14px 22px; border-radius: 10px; text-align: center;
  transform: scale(1.08) rotate(-3deg); transition: transform 220ms var(--ease); box-shadow: 0 14px 32px rgba(0, 0, 0, 0.35); }
.stamp-overlay.is-visible .stamp-box { transform: scale(1) rotate(-2deg); }
.stamp-main { display: block; font-family: var(--font-mono); font-size: 16px; font-weight: 900; letter-spacing: 0.1em; }
.stamp-sub { display: block; font-size: 11px; font-weight: 700; color: var(--brass-dark); margin-top: 2px; }

/* Gaveta de importação */
.modal-backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(11, 31, 58, 0.58); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; padding: 12px; opacity: 0; transition: opacity var(--dur-fast) var(--ease); }
.modal-backdrop[hidden] { display: none; }
.modal-backdrop.is-open { opacity: 1; }
.modal-sheet { width: 100%; max-width: 344px; background: var(--bg-card); border: 1.5px solid var(--brass); border-radius: 16px; padding: 14px; box-shadow: 0 20px 44px rgba(0, 0, 0, 0.45); transform: translateY(14px); transition: transform var(--dur-tactile) var(--ease); max-height: 86vh; overflow-y: auto; }
.modal-backdrop.is-open .modal-sheet { transform: translateY(0); }
.modal-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-bottom: 8px; margin-bottom: 10px; border-bottom: 1px solid var(--border-card); }
.modal-title { margin: 0; font-size: 15px; font-weight: 800; color: var(--ink-primary); }
.modal-close { appearance: none; min-width: 48px; min-height: 48px; border-radius: 10px; border: 1px solid var(--border-card); background: var(--bg-subtle); color: var(--ink-primary); font-size: 13px; font-weight: 800; cursor: pointer; }

/* Consulta: tabelas e listas */
.data-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0 12px; background: var(--branco); border: 1px solid var(--border-card); }
.data-table th, .data-table td { padding: 8px 6px; text-align: left; border-bottom: 1px solid var(--border-card); font-variant-numeric: tabular-nums; }
.data-table thead th { background: var(--bg-subtle); font-weight: 800; color: var(--ink-primary); font-size: 11.5px; }
.kv-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.kv-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; background: var(--branco); border: 1px solid var(--border-card); border-radius: 9px; font-size: 13.5px; }
.kv-k { color: var(--ink-secondary); font-weight: 700; min-width: 0; } .kv-v { color: var(--ink-primary); font-weight: 800; font-variant-numeric: tabular-nums; text-align: right; }
.qual-badge { padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--civic-tint); color: var(--civic-blue); border: 1px solid rgba(19, 64, 116, 0.24); }
.vazio { margin: 0; padding: 10px 12px; background: var(--bg-subtle); border: 1px dashed var(--border-card); border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--ink-secondary); }
code { font-family: var(--font-mono); overflow-wrap: anywhere; }

/* Trajetória partidária */
.party-timeline { position: relative; list-style: none; margin: 8px 0 0; padding: 0 0 0 22px; display: flex; flex-direction: column; gap: 10px; }
.party-timeline::before { content: ""; position: absolute; left: 5px; top: 12px; bottom: 12px; width: 2px; background: var(--border-card); }
.pt-item { position: relative; }
.pt-marker { position: absolute; left: -21px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg-card); border: 2px solid var(--civic-blue); z-index: 1; }
.pt-item.is-latest .pt-marker { background: var(--civic-blue); box-shadow: 0 0 0 3px var(--civic-tint); }
.pt-card { background: var(--branco); border: 1px solid var(--border-card); border-radius: 10px; padding: 9px 10px; display: flex; align-items: flex-start; gap: 9px; min-width: 0; }
.pt-item.is-latest .pt-card { border-color: rgba(19, 64, 116, 0.44); box-shadow: 0 2px 8px rgba(19, 64, 116, 0.08); }
.pt-sigla-box { width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: #FFFFFF; background: var(--civic-blue); }
.pt-body { flex: 1; min-width: 0; }
.pt-meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; margin-bottom: 3px; }
.pt-year-sigla { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.pt-year { font-family: var(--font-mono); font-size: 11px; font-weight: 800; color: var(--brass-dark); }
.pt-sigla { font-size: 13px; font-weight: 800; color: var(--ink-primary); }

<script id="motor">
"use strict";
/* Motor do jogo, sem acesso ao DOM. Roda no navegador e em Node (tests/motor, tools/sim.js).
   Contrato dos módulos (D67): (estado, dados, rngState) => { resultado, rngStateNext }.
   Especificação: docs/especificacao-motor.md. Fórmulas: docs/motor-eleitoral.md. */
var Motor = (function () {

/* == RNG == */
// Gerador sfc32 (Small Fast Counter, 128 bits de estado, contador interno, sem estado proibido).
// Estado explícito e imutável; nenhuma função altera o estado recebido. Sem Math.random, relógio ou estado global.
var RNG = (function () {
  var VERSAO = 1;
  var ALGORITMO = "sfc32";
  var DOMINIOS = Object.freeze(["mundo", "eleicao", "eventos", "cartas"]);
  var DESCARTE = 15; // saídas descartadas após a semeadura, para afastar o estado inicial do hash

  function normalizarSemente(texto) {
    if (typeof texto !== "string") throw new TypeError("semente deve ser texto");
    var s = texto.normalize("NFC").trim().toUpperCase();
    if (s.length === 0) throw new RangeError("semente vazia");
    return s;
  }

  // Hash de 128 bits (quatro faixas de 32 bits com multiplicação e mistura final). Só para semear: não é criptográfico.
  function hash128(str) {
    var h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
    for (var i = 0, k; i < str.length; i++) {
      k = str.charCodeAt(i);
      h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
      h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
      h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
      h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
    }
    h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
    h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
    h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
    h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
    h1 ^= (h2 ^ h3 ^ h4); h2 ^= h1; h3 ^= h1; h4 ^= h1;
    return [h1 >>> 0, h2 >>> 0, h3 >>> 0, h4 >>> 0];
  }

  function passo(s) {
    var a = s[0], b = s[1], c = s[2], d = s[3];
    var t = (((a + b) >>> 0) + d) >>> 0;
    d = (d + 1) >>> 0;
    a = (b ^ (b >>> 9)) >>> 0;
    b = (c + (c << 3)) >>> 0;
    c = ((c << 21) | (c >>> 11)) >>> 0;
    c = (c + t) >>> 0;
    return { valor: t, s: [a, b, c, d] };
  }

  function congelar(dominio, chave, s) {
    return Object.freeze({ versao: VERSAO, algoritmo: ALGORITMO, dominio: dominio, chave: chave, s: Object.freeze(s.slice()) });
  }

  function validarChaves(chaves) {
    for (var i = 0; i < chaves.length; i++) {
      var c = chaves[i];
      if (!(typeof c === "string" || (typeof c === "number" && Number.isSafeInteger(c)))) {
        throw new TypeError("chave de fluxo deve ser texto ou inteiro");
      }
    }
  }

  // Fluxo independente: derivado só da semente, do domínio e das chaves, nunca do consumo de outro fluxo.
  function criar(semente, dominio) {
    if (DOMINIOS.indexOf(dominio) < 0) throw new RangeError("domínio desconhecido: " + dominio);
    var chaves = Array.prototype.slice.call(arguments, 2);
    validarChaves(chaves);
    var chave = JSON.stringify([normalizarSemente(semente), dominio].concat(chaves));
    var s = hash128(chave);
    for (var i = 0; i < DESCARTE; i++) s = passo(s).s;
    return congelar(dominio, chave, s);
  }

  function validar(estado) {
    if (!estado || typeof estado !== "object") throw new TypeError("estado de RNG inválido: ausente");
    if (estado.versao !== VERSAO || estado.algoritmo !== ALGORITMO) throw new TypeError("estado de RNG inválido: versão ou algoritmo");
    if (DOMINIOS.indexOf(estado.dominio) < 0) throw new TypeError("estado de RNG inválido: domínio");
    if (typeof estado.chave !== "string") throw new TypeError("estado de RNG inválido: chave");
    var s = estado.s;
    if (!Array.isArray(s) || s.length !== 4) throw new TypeError("estado de RNG inválido: palavras");
    for (var i = 0; i < 4; i++) {
      if (!Number.isInteger(s[i]) || s[i] < 0 || s[i] > 0xFFFFFFFF) throw new TypeError("estado de RNG inválido: palavra fora de 32 bits");
    }
    // nova estrutura congelada: um estado restaurado de JSON não fica mutável por referência externa
    return congelar(estado.dominio, estado.chave, s);
  }

  // Inteiro de 32 bits sem sinal, 0 a 2^32 - 1.
  function u32(estado) {
    estado = validar(estado);
    var r = passo(estado.s);
    return { valor: r.valor, rngStateNext: congelar(estado.dominio, estado.chave, r.s) };
  }

  // Inteiro uniforme em [0, n), sem viés (rejeição). n inteiro de 1 a 2^32.
  function inteiro(estado, n) {
    if (!Number.isInteger(n) || n < 1 || n > 4294967296) throw new RangeError("n deve ser inteiro de 1 a 2^32");
    var limite = 4294967296 - (4294967296 % n);
    var e = estado, r;
    do { r = u32(e); e = r.rngStateNext; } while (r.valor >= limite);
    return { valor: r.valor % n, rngStateNext: e };
  }

  // Decimal uniforme em [0, 1), com 53 bits (duas palavras).
  function decimal(estado) {
    var r1 = u32(estado), r2 = u32(r1.rngStateNext);
    var v = ((r1.valor >>> 5) * 67108864 + (r2.valor >>> 6)) / 9007199254740992;
    return { valor: v, rngStateNext: r2.rngStateNext };
  }

  // Normal padrão pelo método polar de Marsaglia, sem cache: cada chamada usa só um dos dois valores do par, e
  // nenhum estado fica fora de rngState. Consome um número variável de uniformes (rejeição fora do círculo unitário).
  // Usa Math.log e Math.sqrt: reproduzível no mesmo motor JavaScript; igualdade bit a bit entre motores diferentes
  // não é garantida pela especificação da linguagem para Math.log.
  function normal(estado) {
    var e = estado, u, v, q;
    do {
      var a = decimal(e); e = a.rngStateNext;
      var b = decimal(e); e = b.rngStateNext;
      u = 2 * a.valor - 1; v = 2 * b.valor - 1; q = u * u + v * v;
    } while (q >= 1 || q === 0);
    return { valor: u * Math.sqrt(-2 * Math.log(q) / q), rngStateNext: e };
  }

  return Object.freeze({ VERSAO: VERSAO, ALGORITMO: ALGORITMO, DOMINIOS: DOMINIOS,
    normalizarSemente: normalizarSemente, criar: criar, validar: validar, u32: u32, inteiro: inteiro, decimal: decimal, normal: normal });
})();

// Funções comuns de validação e desempate, usadas por todos os módulos.
var Comum = (function () {
  var ID = /^[A-Za-z0-9][A-Za-z0-9_.:|-]{0,127}$/;
  var TOL = 1e-9;
  function erro(msg) { throw new TypeError(msg); }
  function ehId(v) { return typeof v === "string" && ID.test(v); }
  function idv(v, campo) { if (!ehId(v)) erro(campo + ": identificador inválido"); return v; }
  function inteiro(v, campo, min) { if (!Number.isSafeInteger(v) || v < min) erro(campo + ": inteiro maior ou igual a " + min); return v; }
  function real(v, campo, min, max) {
    if (typeof v !== "number" || !Number.isFinite(v) || v < min || (max !== undefined && v > max)) erro(campo + ": número fora da faixa");
    return v;
  }
  // chave própria de objeto recebido: ids como "constructor" não alcançam o protótipo
  function proprio(o, k) { return o && Object.prototype.hasOwnProperty.call(o, k) ? o[k] : undefined; }
  function porId(a, b) { return a.id < b.id ? -1 : 1; }
  // resolvedor de desempate técnico injetado (módulo 14), mesmo contrato do módulo 10
  function resolver(ctx, empatados, contexto) {
    if (typeof ctx.resolver !== "function") throw new Error("desempate técnico necessário e nenhum resolvedor informado (módulo 14)");
    var ids = empatados.slice().sort();
    var r = ctx.resolver(ids, contexto, ctx.rng);
    if (!r || ids.indexOf(r.vencedorId) < 0) throw new Error("resolvedor de desempate devolveu vencedor fora dos empatados");
    ctx.rng = r.rngStateNext === undefined ? ctx.rng : r.rngStateNext;
    ctx.desempates.push({ tipo: contexto.tipo, empatados: ids, vencedorId: r.vencedorId });
    return r.vencedorId;
  }
  return Object.freeze({ TOL: TOL, erro: erro, ehId: ehId, idv: idv, proprio: proprio, inteiro: inteiro, real: real, porId: porId, resolver: resolver });
})();

/* == DADOS == */
// Estruturas fundamentais. Dados estáticos: congelados, sem estado de RNG nem campos mutáveis.
// Estado mutável: só em EstadoEleicao, sempre substituído por um novo objeto (nunca alterado no lugar).
var Dados = (function () {
  var CARGOS = Object.freeze({
    VEREADOR: Object.freeze({ sistema: "proporcional", segundoTurno: false, eleicao: "municipal" }),
    DEPUTADO_ESTADUAL: Object.freeze({ sistema: "proporcional", segundoTurno: false, eleicao: "geral" }),
    DEPUTADO_DISTRITAL: Object.freeze({ sistema: "proporcional", segundoTurno: false, eleicao: "geral" }),
    DEPUTADO_FEDERAL: Object.freeze({ sistema: "proporcional", segundoTurno: false, eleicao: "geral" }),
    PREFEITO: Object.freeze({ sistema: "majoritario", segundoTurno: true, eleicao: "municipal" }),
    GOVERNADOR: Object.freeze({ sistema: "majoritario", segundoTurno: true, eleicao: "geral" }),
    SENADOR: Object.freeze({ sistema: "majoritario", segundoTurno: false, eleicao: "geral" }),
    PRESIDENTE: Object.freeze({ sistema: "majoritario", segundoTurno: true, eleicao: "geral" })
  }); // vices integram a chapa do titular (regras-e-mundo.md 1); não são disputas próprias
  // segundoTurno: o cargo admite 2º turno (módulo 12); o Senado tem apuração própria (módulo 13), sem 2º turno.
  // eleicao: calendário ordinário do cargo; gerais a cada 4 anos a partir de 2026, municipais a partir de 2028 (GDD 3).
  var PRIMEIRO_ANO = Object.freeze({ geral: 2026, municipal: 2028 });
  var TIPOS_UNIDADE = ["municipio", "uf", "pais", "exterior"];
  var FASES = ["preparada", "apurada", "concluida"];

  var erro = Comum.erro, id = Comum.idv;
  function texto(v, campo) { if (typeof v !== "string" || v.trim() === "") erro(campo + ": texto obrigatório"); return v; }
  function inteiroNaoNeg(v, campo) { if (!Number.isSafeInteger(v) || v < 0) erro(campo + ": inteiro não negativo obrigatório"); return v; }
  function profundo(o) {
    Object.keys(o).forEach(function (k) { if (o[k] && typeof o[k] === "object") profundo(o[k]); });
    return Object.freeze(o);
  }
  function idsUnicos(lista, campo) {
    var vistos = new Set();
    lista.forEach(function (x) { id(x, campo); if (vistos.has(x)) erro(campo + ": identificador repetido " + x); vistos.add(x); });
    return lista.slice();
  }

  function unidade(o) {
    if (TIPOS_UNIDADE.indexOf(o.tipo) < 0) erro("unidade.tipo inválido");
    return profundo({ id: id(o.id, "unidade.id"), tipo: o.tipo, uf: o.tipo === "pais" ? null : texto(o.uf, "unidade.uf") });
  }

  function partido(o) {
    return profundo({ id: id(o.id, "partido.id"), sigla: texto(o.sigla, "partido.sigla"), nome: texto(o.nome, "partido.nome") });
  }

  function federacao(o) {
    if (!Array.isArray(o.partidos) || o.partidos.length < 2) erro("federacao.partidos: ao menos dois partidos");
    return profundo({ id: id(o.id, "federacao.id"), nome: texto(o.nome, "federacao.nome"), partidos: idsUnicos(o.partidos, "federacao.partidos").sort() });
  }

  // Disputa de eleição ordinária: cargo, unidade, vagas e turno. Vagas vêm como dado (não recalculadas por população).
  // Eleição suplementar (qualquer ano) não é representada aqui: fica para estrutura própria do módulo 15.
  function disputa(o) {
    if (typeof o.cargo !== "string" || !Object.prototype.hasOwnProperty.call(CARGOS, o.cargo)) erro("disputa.cargo desconhecido");
    var cargo = CARGOS[o.cargo];
    if (!Number.isSafeInteger(o.vagas) || o.vagas < 1) erro("disputa.vagas: inteiro positivo obrigatório");
    if (o.turno !== 1 && o.turno !== 2) erro("disputa.turno: 1 ou 2");
    if (o.turno === 2 && !cargo.segundoTurno) erro("disputa.turno: cargo sem 2º turno");
    var inicio = PRIMEIRO_ANO[cargo.eleicao];
    if (!Number.isSafeInteger(o.ano) || o.ano < inicio || (o.ano - inicio) % 4 !== 0) erro("disputa.ano: sem eleição ordinária do cargo nesse ano");
    var vpe;
    if (o.cargo === "SENADOR") {
      // motor-eleitoral.md 4.2.1: 2 vagas e 2 votos nas renovações de dois terços ((ano - 2010) múltiplo de 8), senão 1 e 1
      var doisTercos = (o.ano - 2010) % 8 === 0;
      if (o.votosPorEleitor === undefined) erro("disputa.votosPorEleitor: obrigatório no Senado");
      vpe = o.votosPorEleitor;
      if (vpe !== (doisTercos ? 2 : 1) || o.vagas !== vpe) erro("disputa: vagas e votos por eleitor incompatíveis com o ano do Senado");
    } else {
      vpe = o.votosPorEleitor === undefined ? 1 : o.votosPorEleitor;
      if (vpe !== 1) erro("disputa.votosPorEleitor: 2 só no Senado");
    }
    return profundo({ id: id(o.id, "disputa.id"), ano: o.ano, cargo: o.cargo, sistema: cargo.sistema,
      unidadeId: id(o.unidadeId, "disputa.unidadeId"), vagas: o.vagas, turno: o.turno, votosPorEleitor: vpe });
  }

  // Candidatura individual (pessoa do jogo) ou sintética (motor-eleitoral.md 5.3). listaId: partido ou federação.
  function candidatura(o) {
    if (o.tipo !== "individual" && o.tipo !== "sintetica") erro("candidatura.tipo inválido");
    if (o.tipo === "individual") id(o.pessoaId, "candidatura.pessoaId");
    return profundo({ id: id(o.id, "candidatura.id"), disputaId: id(o.disputaId, "candidatura.disputaId"),
      listaId: id(o.listaId, "candidatura.listaId"), tipo: o.tipo, pessoaId: o.tipo === "individual" ? o.pessoaId : null });
  }

  // Estado mutável da eleição: fase e estado do fluxo de RNG do domínio eleição.
  function estadoEleicao(o) {
    if (FASES.indexOf(o.fase) < 0) erro("estadoEleicao.fase inválida");
    var rng = RNG.validar(o.rngState);
    if (rng.dominio !== "eleicao") erro("estadoEleicao.rngState: fluxo de outro domínio");
    return Object.freeze({ disputaId: id(o.disputaId, "estadoEleicao.disputaId"), fase: o.fase, rngState: rng });
  }

  function mapaInteiros(m, campo) {
    if (!m || typeof m !== "object" || Array.isArray(m)) erro(campo + ": objeto obrigatório");
    var out = {}, soma = 0;
    Object.keys(m).sort().forEach(function (k) { id(k, campo); out[k] = inteiroNaoNeg(m[k], campo + "." + k); soma += m[k]; });
    return { mapa: out, soma: soma };
  }

  // Resultado da apuração: votos por concorrente; soma exatamente igual aos válidos.
  function resultadoApuracao(o) {
    var v = mapaInteiros(o.votos, "resultadoApuracao.votos");
    inteiroNaoNeg(o.validos, "resultadoApuracao.validos");
    if (v.soma !== o.validos) erro("resultadoApuracao: soma dos votos diferente dos válidos");
    return profundo({ disputaId: id(o.disputaId, "resultadoApuracao.disputaId"), validos: o.validos, votos: v.mapa });
  }

  // Resultado da distribuição de cadeiras. cadeiras: cadeiras ocupadas por lista (soma igual ao número de eleitos);
  // ocupadas mais não preenchidas somam as vagas. suplentes: por lista, ids em ordem de suplência.
  function resultadoCadeiras(o) {
    if (!Number.isSafeInteger(o.vagas) || o.vagas < 1) erro("resultadoCadeiras.vagas inválido");
    var c = mapaInteiros(o.cadeiras, "resultadoCadeiras.cadeiras");
    var eleitos = idsUnicos(Array.isArray(o.eleitos) ? o.eleitos : erro("resultadoCadeiras.eleitos: lista obrigatória"), "resultadoCadeiras.eleitos");
    inteiroNaoNeg(o.naoPreenchidas, "resultadoCadeiras.naoPreenchidas");
    if (c.soma !== eleitos.length) erro("resultadoCadeiras: cadeiras ocupadas diferentes do número de eleitos");
    if (eleitos.length + o.naoPreenchidas !== o.vagas) erro("resultadoCadeiras: eleitos mais não preenchidas diferente das vagas");
    var sup = {};
    var todos = new Set(eleitos);
    var fonte = o.suplentes === undefined ? {} : o.suplentes;
    if (!fonte || typeof fonte !== "object" || Array.isArray(fonte)) erro("resultadoCadeiras.suplentes: objeto obrigatório");
    Object.keys(fonte).sort().forEach(function (k) {
      id(k, "resultadoCadeiras.suplentes");
      sup[k] = idsUnicos(Array.isArray(fonte[k]) ? fonte[k] : erro("resultadoCadeiras.suplentes." + k + ": lista obrigatória"), "resultadoCadeiras.suplentes." + k);
      sup[k].forEach(function (x) { if (todos.has(x)) erro("resultadoCadeiras: candidato eleito ou repetido na suplência " + x); todos.add(x); });
    });
    return profundo({ disputaId: id(o.disputaId, "resultadoCadeiras.disputaId"), vagas: o.vagas, cadeiras: c.mapa,
      eleitos: eleitos, naoPreenchidas: o.naoPreenchidas, suplentes: sup,
      desempates: Array.isArray(o.desempates) ? o.desempates.slice() : [] });
  }

  return Object.freeze({ CARGOS: CARGOS, unidade: unidade, partido: partido, federacao: federacao, disputa: disputa,
    candidatura: candidatura, estadoEleicao: estadoEleicao, resultadoApuracao: resultadoApuracao, resultadoCadeiras: resultadoCadeiras });
})();

/* == MOTOR ELEITORAL == */
// Maior resto genérico (motor-eleitoral.md 4.3). Aritmética exata com BigInt: cada peso (número finito) é convertido
// sem perda para inteiro escalado por potência de 2; quotas e restos são comparados como frações de mesmo denominador.
// Não contém regra eleitoral: a distribuição de cadeiras é a seção 5.4.
var MaiorResto = (function () {

  function decompor(x) { // x = m × 2^e, exato
    var dv = new DataView(new ArrayBuffer(8));
    dv.setFloat64(0, x);
    var hi = dv.getUint32(0), lo = dv.getUint32(4);
    var exp = (hi >>> 20) & 0x7ff;
    var m = (BigInt(hi & 0xfffff) << 32n) | BigInt(lo);
    if (exp === 0) return { m: m, e: -1074 };
    return { m: m | (1n << 52n), e: exp - 1075 };
  }

  // participantes: [{ id, peso }]. Retorna { id: inteiro }. Empate de restos: id em ordem crescente de código UTF-16,
  // ou, com opcoes.ordemDesempate (lista de ids sem repetição), pela posição nessa lista; ids fora dela vêm depois,
  // em ordem UTF-16. Ex.: "F por último" da seção 5.2.
  // Soma dos pesos zero: total 0 devolve zeros; total positivo é erro (o chamador decide a regra, ex.: 5.5).
  function distribuir(total, participantes, opcoes) {
    var posicao = new Map();
    if (opcoes !== undefined && opcoes !== null) {
      if (typeof opcoes !== "object") throw new TypeError("opções inválidas");
      if (opcoes.ordemDesempate !== undefined) {
        if (!Array.isArray(opcoes.ordemDesempate)) throw new TypeError("ordemDesempate deve ser lista de ids");
        opcoes.ordemDesempate.forEach(function (x, i) {
          if (!Comum.ehId(x)) throw new TypeError("ordemDesempate com id inválido");
          if (posicao.has(x)) throw new TypeError("ordemDesempate com id repetido: " + x);
          posicao.set(x, i);
        });
      }
    }
    function antes(a, b) {
      var pa = posicao.has(a.id) ? posicao.get(a.id) : Infinity, pb = posicao.has(b.id) ? posicao.get(b.id) : Infinity;
      if (pa !== pb) return pa < pb ? -1 : 1;
      return a.id < b.id ? -1 : 1;
    }
    if (!Number.isSafeInteger(total) || total < 0) throw new RangeError("total deve ser inteiro não negativo");
    if (!Array.isArray(participantes) || participantes.length === 0) throw new TypeError("participantes obrigatórios");
    var vistos = new Set();
    var lista = participantes.map(function (p) {
      if (!p || !Comum.ehId(p.id)) throw new TypeError("participante com id inválido");
      if (vistos.has(p.id)) throw new TypeError("id repetido: " + p.id);
      vistos.add(p.id);
      if (typeof p.peso !== "number" || !Number.isFinite(p.peso) || p.peso < 0) throw new RangeError("peso inválido para " + p.id);
      return { id: p.id, d: p.peso === 0 ? null : decompor(p.peso) };
    }).sort(function (a, b) { return a.id < b.id ? -1 : 1; });
    var eMin = Infinity;
    lista.forEach(function (p) { if (p.d && p.d.e < eMin) eMin = p.d.e; });
    var soma = 0n;
    lista.forEach(function (p) { p.w = p.d ? p.d.m << BigInt(p.d.e - eMin) : 0n; soma += p.w; });
    var out = {};
    if (total === 0) { lista.forEach(function (p) { out[p.id] = 0; }); return out; }
    if (soma === 0n) throw new RangeError("soma dos pesos igual a zero com total positivo");
    var T = BigInt(total), distribuido = 0n;
    lista.forEach(function (p) { var q = T * p.w; p.piso = q / soma; p.resto = q % soma; distribuido += p.piso; });
    var sobra = Number(T - distribuido); // menor que o número de participantes com resto positivo
    var ordem = lista.slice().sort(function (a, b) {
      if (a.resto !== b.resto) return a.resto > b.resto ? -1 : 1;
      return antes(a, b);
    });
    for (var i = 0; i < sobra; i++) ordem[i].piso += 1n;
    lista.forEach(function (p) { out[p.id] = Number(p.piso); });
    return out;
  }

  return Object.freeze({ distribuir: distribuir });
})();

// Pontuação com ruído (motor-eleitoral.md 4.1; na majoritária, seção 6 com ε, D69).
// S_c = Π_k (x_ck + ε)^(w_k) × exp(σ_c Z_c - σ_c²/2). Z_c sorteado em ordem de id, um por concorrente, mesmo com σ_c = 0,
// para que a sequência não dependa dos valores de σ. Math.pow e Math.exp: mesma observação de RNG.normal.
var Pontuacao = (function () {
  function base(fatores, pesos, epsilon) {
    Comum.real(epsilon, "epsilon", 0);
    if (!(epsilon > 0)) Comum.erro("epsilon deve ser positivo");
    if (!fatores || typeof fatores !== "object" || !pesos || typeof pesos !== "object") Comum.erro("fatores e pesos obrigatórios");
    var nomes = Object.keys(pesos).sort();
    if (nomes.length === 0) Comum.erro("ao menos um peso");
    if (Object.keys(fatores).sort().join("|") !== nomes.join("|")) Comum.erro("fatores e pesos com nomes diferentes");
    var soma = 0, prod = 1;
    nomes.forEach(function (k) {
      var w = Comum.real(pesos[k], "peso " + k, 0), x = Comum.real(fatores[k], "fator " + k, 0, 1);
      soma += w; prod *= Math.pow(x + epsilon, w);
    });
    if (Math.abs(soma - 1) > Comum.TOL) Comum.erro("soma dos pesos diferente de 1");
    return prod;
  }
  // concorrentes: [{ id, fatores, pesos, epsilon, sigma }]. Retorna { resultado: { id: S }, rngStateNext }.
  function calcularLote(concorrentes, rngState) {
    if (!Array.isArray(concorrentes) || concorrentes.length === 0) Comum.erro("concorrentes obrigatórios");
    var vistos = new Set();
    var lista = concorrentes.map(function (c) {
      Comum.idv(c.id, "concorrente.id");
      if (vistos.has(c.id)) Comum.erro("concorrente repetido: " + c.id);
      vistos.add(c.id);
      return c;
    }).sort(Comum.porId);
    var e = RNG.validar(rngState);
    if (e.dominio !== "eleicao") Comum.erro("pontuação usa o fluxo de eleição");
    var out = {};
    lista.forEach(function (c) {
      var sigma = Comum.real(c.sigma, "sigma de " + c.id, 0);
      var z = RNG.normal(e); e = z.rngStateNext;
      out[c.id] = base(c.fatores, c.pesos, c.epsilon) * Math.exp(sigma * z.valor - sigma * sigma / 2);
    });
    return { resultado: out, rngStateNext: e };
  }
  // Pontuação efetiva da legenda (5.1; D71): S_ℓL = λ_L × ruido_ℓL. listas: [{ id, lambda, sigma }], Z em ordem de id.
  // O valor vai ao campo `lambda` do módulo 9.
  function legendas(listas, rngState) {
    if (!Array.isArray(listas) || listas.length === 0) Comum.erro("listas obrigatórias");
    var vistos = new Set();
    var ls = listas.map(function (l) {
      Comum.idv(l.id, "lista.id");
      if (vistos.has(l.id)) Comum.erro("lista repetida: " + l.id);
      vistos.add(l.id);
      return { id: l.id, lambda: Comum.real(l.lambda, "lambda de " + l.id, 0), sigma: Comum.real(l.sigma, "sigma de " + l.id, 0) };
    }).sort(Comum.porId);
    var e = RNG.validar(rngState);
    if (e.dominio !== "eleicao") Comum.erro("pontuação usa o fluxo de eleição");
    var out = {};
    ls.forEach(function (l) {
      var z = RNG.normal(e); e = z.rngStateNext;
      out[l.id] = l.lambda * Math.exp(l.sigma * z.valor - l.sigma * l.sigma / 2);
    });
    return { resultado: out, rngStateNext: e };
  }
  return Object.freeze({ base: base, calcularLote: calcularLote, legendas: legendas });
})();

// Módulo 8: comparecimento e votos válidos (4.2.1; D42 e complemento; D59; D62). Sem sorteio.
// Dois níveis de maior resto: eleitorado entre comparecimento, abstenção e seções não instaladas; depois
// comparecimento × votosPorEleitor entre as seis parcelas da D59. Taxas em uma de duas formas, uniforme por nível:
// { numerador, denominador } inteiros com denominador comum e numeradores somando o denominador (exato, como o
// pipeline produz), ou números somando 1 com tolerância de 1e-9.
var Comparecimento = (function () {
  var NIVEL1 = ["comparecimento", "abstencao", "eleitoresSecoesNaoInstaladas"];
  var NIVEL2 = ["validos", "brancos", "nulos", "anulados", "anuladosSubJudice", "anuladosApuracaoSeparada"];
  function pesos(taxas, nomes, campo) {
    if (!taxas || typeof taxas !== "object") Comum.erro(campo + ": taxas obrigatórias");
    if (Object.keys(taxas).sort().join("|") !== nomes.slice().sort().join("|")) Comum.erro(campo + ": parcelas esperadas " + nomes.join(", "));
    var exatas = nomes.every(function (n) { return taxas[n] && typeof taxas[n] === "object"; });
    var numeros = nomes.every(function (n) { return typeof taxas[n] === "number"; });
    if (exatas) {
      var den = Comum.inteiro(taxas[nomes[0]].denominador, campo + ".denominador", 1), soma = 0;
      nomes.forEach(function (n) {
        if (taxas[n].denominador !== den) Comum.erro(campo + ": denominadores diferentes no mesmo nível");
        soma += Comum.inteiro(taxas[n].numerador, campo + "." + n + ".numerador", 0);
      });
      if (soma !== den) Comum.erro(campo + ": numeradores não somam o denominador");
      return nomes.map(function (n) { return { id: n, peso: taxas[n].numerador }; });
    }
    if (!numeros) Comum.erro(campo + ": taxas todas exatas ou todas numéricas");
    var s = 0;
    nomes.forEach(function (n) { s += Comum.real(taxas[n], campo + "." + n, 0, 1); });
    if (Math.abs(s - 1) > Comum.TOL) Comum.erro(campo + ": taxas não somam 1");
    return nomes.map(function (n) { return { id: n, peso: taxas[n] }; });
  }
  function calcular(estado, dados, rngState) {
    var disputaId = Comum.idv(dados.disputaId, "dados.disputaId");
    var eleitorado = Comum.inteiro(dados.eleitorado, "dados.eleitorado", 0);
    var vpe = dados.votosPorEleitor;
    if (vpe !== 1 && vpe !== 2) Comum.erro("votosPorEleitor: 1 ou 2");
    var n1 = MaiorResto.distribuir(eleitorado, pesos(dados.taxasEleitorado, NIVEL1, "taxasEleitorado"));
    var possiveis = n1.comparecimento * vpe;
    var n2 = MaiorResto.distribuir(possiveis, pesos(dados.taxasVotos, NIVEL2, "taxasVotos"));
    var out = { disputaId: disputaId, eleitorado: eleitorado, votosPorEleitor: vpe, votosPossiveis: possiveis,
      origem: dados.origem === undefined ? null : JSON.parse(JSON.stringify(dados.origem)) };
    NIVEL1.forEach(function (n) { out[n] = n1[n]; });
    NIVEL2.forEach(function (n) { out[n] = n2[n]; });
    // conferência das identidades (D42, complemento item 1; D59)
    if (out.comparecimento + out.abstencao + out.eleitoresSecoesNaoInstaladas !== eleitorado) throw new Error("identidade do eleitorado violada");
    if (NIVEL2.reduce(function (a, n) { return a + out[n]; }, 0) !== possiveis) throw new Error("identidade D59 violada");
    return { resultado: Object.freeze(out), rngStateNext: rngState };
  }
  return Object.freeze({ calcular: calcular });
})();

// Módulo 9: apuração proporcional (5.2; D35, D49, D50). Pontuações S_i recebidas prontas (Pontuacao.calcularLote).
// Segmento fiel I_L: legenda (pontuação λ_L) e candidatos da lista (S_i) na forma 4.2, τ = 1 e D = 0.
// Segmento livre F: dois níveis só no arredondamento (listas por S_L = Σ S_i, depois candidatos), D50.
var Proporcional = (function () {
  var LIVRE = "segmento:livre", LEGENDA = "legenda:L"; // ids reservados internos
  function apurar(estado, dados, rngState) {
    var disputaId = Comum.idv(dados.disputaId, "dados.disputaId");
    var validos = Comum.inteiro(dados.validos, "dados.validos", 0);
    var delta = Comum.real(dados.delta, "delta", 0, 1);
    if (dados.tau !== undefined && dados.tau !== 1) Comum.erro("tau: estrutural 1 (4.2); outro valor só por calibração aprovada");
    var semId = Comum.real(dados.semIdentificacao, "semIdentificacao", 0, 1);
    if (!Array.isArray(dados.listas) || dados.listas.length === 0) Comum.erro("dados.listas: ao menos uma lista");
    var ids = new Set(), cands = new Set();
    var listas = dados.listas.map(function (l) {
      Comum.idv(l.id, "lista.id");
      if (l.id === LIVRE || l.id === LEGENDA) Comum.erro("lista.id reservado");
      if (ids.has(l.id)) Comum.erro("lista repetida: " + l.id);
      ids.add(l.id);
      if (!Array.isArray(l.candidatos)) Comum.erro("lista." + l.id + ".candidatos: lista obrigatória");
      var cs = l.candidatos.map(function (c) {
        Comum.idv(c.id, "candidato.id");
        if (cands.has(c.id) || ids.has(c.id) || c.id === LIVRE || c.id === LEGENDA) Comum.erro("candidato repetido ou com id de lista: " + c.id);
        cands.add(c.id);
        return { id: c.id, S: Comum.real(c.S, "S de " + c.id, 0) };
      }).sort(Comum.porId);
      return { id: l.id, ident: Comum.real(l.identPartidaria, "identPartidaria de " + l.id, 0, 1),
        lambda: Comum.real(l.lambda, "lambda de " + l.id, 0), candidatos: cs };
    }).sort(Comum.porId);
    listas.forEach(function (l) { if (cands.has(l.id)) Comum.erro("lista com id de candidato: " + l.id); });
    var somaId = listas.reduce(function (a, l) { return a + l.ident; }, 0);
    if (Math.abs(somaId + semId - 1) > Comum.TOL) Comum.erro("identificação partidária e semIdentificacao não somam 1");

    // passo 2: segmentos inteiros; F por último no desempate. Peso de F = semIdentificacao + δ × Σ ident (= 1 - Σ peso_L)
    var pesosSeg = listas.map(function (l) { return { id: l.id, peso: l.ident * (1 - delta) }; });
    pesosSeg.push({ id: LIVRE, peso: semId + delta * somaId });
    var seg = MaiorResto.distribuir(validos, pesosSeg, { ordemDesempate: listas.map(function (l) { return l.id; }).concat([LIVRE]) });
    var F = seg[LIVRE];
    var votos = {}, legenda = {}, fiel = {}, livrePorLista = {};
    listas.forEach(function (l) { l.candidatos.forEach(function (c) { votos[c.id] = 0; }); legenda[l.id] = 0; livrePorLista[l.id] = 0; });

    // passo 3: segmento fiel
    listas.forEach(function (l) {
      var I = seg[l.id]; fiel[l.id] = I;
      if (I === 0) return;
      var legId = LEGENDA;
      var part = [{ id: legId, peso: l.candidatos.length === 0 ? 1 : l.lambda }].concat(l.candidatos.map(function (c) { return { id: c.id, peso: c.S }; }));
      if (part.every(function (x) { return x.peso === 0; })) Comum.erro("segmento fiel positivo sem legenda nem candidato com pontuação: " + l.id);
      var r = MaiorResto.distribuir(I, part);
      legenda[l.id] += r[legId];
      l.candidatos.forEach(function (c) { votos[c.id] += r[c.id]; });
    });

    // passo 4: segmento livre em dois níveis
    if (F > 0) {
      var comS = listas.filter(function (l) { return l.candidatos.some(function (c) { return c.S > 0; }); });
      if (comS.length === 0) Comum.erro("segmento livre positivo sem candidato com pontuação positiva");
      var FL = MaiorResto.distribuir(F, comS.map(function (l) {
        return { id: l.id, peso: l.candidatos.reduce(function (a, c) { return a + c.S; }, 0) };
      }));
      comS.forEach(function (l) {
        livrePorLista[l.id] = FL[l.id];
        if (FL[l.id] === 0) return;
        var r = MaiorResto.distribuir(FL[l.id], l.candidatos.map(function (c) { return { id: c.id, peso: c.S }; }));
        l.candidatos.forEach(function (c) { votos[c.id] += r[c.id]; });
      });
    }
    var votosLista = {};
    listas.forEach(function (l) { votosLista[l.id] = legenda[l.id] + l.candidatos.reduce(function (a, c) { return a + votos[c.id]; }, 0); });
    var total = listas.reduce(function (a, l) { return a + votosLista[l.id]; }, 0);
    if (total !== validos) throw new Error("conservação dos válidos violada");
    var out = { disputaId: disputaId, validos: validos, votos: votos, legenda: legenda, votosLista: votosLista,
      segmentos: { fiel: fiel, livre: F, livrePorLista: livrePorLista } };
    return { resultado: JSON.parse(JSON.stringify(out)), rngStateNext: rngState };
  }
  return Object.freeze({ apurar: apurar, ID_SEGMENTO_LIVRE: LIVRE });
})();

// Módulo 11: apuração majoritária e decisão de 2º turno (6; Res. TSE 23.677, arts. 5º e 6º; D69).
// Votos por chapa na forma 4.2 (τ = 1) sobre os válidos, com a alternativa D (candidaturas não modeladas) como
// concorrente reservado. Senado e prefeito até 200 mil eleitores: maioria simples, turno único. Presidente,
// governador e prefeito acima de 200 mil: maioria absoluta (2 × votos > válidos) ou 2º turno com dois finalistas.
var Majoritaria = (function () {
  var NAO_MODELADOS = "naoModelados:D";
  var CARGOS = { PREFEITO: true, GOVERNADOR: true, PRESIDENTE: true, SENADOR: true };
  var LIMITE_PREFEITO = 200000; // CF/88, art. 29, II (L20): 2º turno só acima de 200 mil eleitores

  // primeiros k concorrentes por votos; empate que atravessa a posição k vai ao desempate técnico
  function primeiros(chapas, votos, k, ctx, tipo) {
    var ord = chapas.slice().sort(function (a, b) { return votos[b.id] - votos[a.id] || (a.id < b.id ? -1 : 1); });
    var escolhidos = [];
    var i = 0;
    while (escolhidos.length < k && i < ord.length) {
      var j = i;
      while (j < ord.length && votos[ord[j].id] === votos[ord[i].id]) j++;
      var grupo = ord.slice(i, j).map(function (c) { return c.id; });
      while (grupo.length > 0 && escolhidos.length < k) {
        if (grupo.length <= k - escolhidos.length) { escolhidos = escolhidos.concat(grupo); grupo = []; break; }
        var v = Comum.resolver(ctx, grupo, { tipo: tipo, disputaId: ctx.disputaId, posicao: escolhidos.length + 1 });
        escolhidos.push(v);
        grupo = grupo.filter(function (x) { return x !== v; });
      }
      i = j;
    }
    return escolhidos;
  }

  function apurar(estado, dados, rngState) {
    var opcoes = (estado && estado.opcoes) || {};
    var disputaId = Comum.idv(dados.disputaId, "dados.disputaId");
    if (typeof dados.cargo !== "string" || !Object.prototype.hasOwnProperty.call(CARGOS, dados.cargo)) Comum.erro("cargo majoritário desconhecido");
    var vagas = Comum.inteiro(dados.vagas, "dados.vagas", 1);
    if (dados.cargo === "SENADOR" && vagas === 2) Comum.erro("Senado com 2 vagas: use o módulo 13 (Senado.apurar, D70)");
    if (vagas !== 1) Comum.erro("vagas incompatíveis com o cargo");
    var eleitorado = Comum.inteiro(dados.eleitorado, "dados.eleitorado", 0);
    var validos = Comum.inteiro(dados.validos, "dados.validos", 1);
    if (validos > eleitorado) Comum.erro("validos excede o máximo possível para o eleitorado");
    if (dados.tau !== undefined && dados.tau !== 1) Comum.erro("tau: estrutural 1 (4.2)");
    var D = dados.D === undefined ? 0 : Comum.real(dados.D, "D", 0);
    if (!Array.isArray(dados.chapas) || dados.chapas.length === 0) Comum.erro("dados.chapas: ao menos uma chapa");
    var vistos = new Set();
    var chapas = dados.chapas.map(function (c) {
      Comum.idv(c.id, "chapa.id");
      if (c.id === NAO_MODELADOS || vistos.has(c.id)) Comum.erro("chapa repetida ou reservada: " + c.id);
      vistos.add(c.id);
      return { id: c.id, S: Comum.real(c.S, "S de " + c.id, 0) };
    }).sort(Comum.porId);
    var part = chapas.map(function (c) { return { id: c.id, peso: c.S }; });
    if (D > 0) part.push({ id: NAO_MODELADOS, peso: D });
    var votos = MaiorResto.distribuir(validos, part);
    var naoModelados = D > 0 ? votos[NAO_MODELADOS] : 0;
    delete votos[NAO_MODELADOS];

    var ctx = { disputaId: disputaId, resolver: opcoes.resolverDesempateTecnico, rng: rngState, desempates: [] };
    var absoluta = dados.cargo !== "SENADOR" && !(dados.cargo === "PREFEITO" && eleitorado <= LIMITE_PREFEITO);
    var out = { disputaId: disputaId, cargo: dados.cargo, validos: validos, votos: votos, votosNaoModelados: naoModelados,
      regra: absoluta ? "maioriaAbsoluta" : "maioriaSimples", segundoTurno: false, eleitos: [], finalistas: null };

    function exigirModelagem(posicoes) {
      // os não modelados não podem igualar ou superar a última posição decisiva: o resultado ficaria indefinido
      var ultimo = votos[posicoes[posicoes.length - 1]];
      if (naoModelados > 0 && naoModelados >= ultimo) throw new Error("insuficiência de modelagem: votos não modelados alcançam posição decisiva");
    }
    if (absoluta) {
      var lider = chapas.filter(function (c) { return 2 * votos[c.id] > validos; });
      if (lider.length === 1) {
        out.eleitos = [lider[0].id];
      } else {
        if (chapas.length < 2) throw new Error("2º turno exigido com uma só chapa");
        var fin = primeiros(chapas, votos, 2, ctx, "finalistasMajoritario");
        exigirModelagem(fin);
        out.segundoTurno = true; out.finalistas = fin;
      }
    } else {
      var el = primeiros(chapas, votos, vagas, ctx, "majoritario");
      exigirModelagem(el);
      out.eleitos = el;
    }
    out.desempates = ctx.desempates;
    return { resultado: JSON.parse(JSON.stringify(out)), rngStateNext: ctx.rng };
  }
  return Object.freeze({ apurar: apurar, classificar: primeiros, ID_NAO_MODELADOS: NAO_MODELADOS, LIMITE_PREFEITO: LIMITE_PREFEITO });
})();

// Módulo 13: Senado (6.2; D70). 1 vaga: turno único do módulo 11, com 1 voto por eleitor. 2 vagas: dois votos por
// eleitor para candidatos distintos, por distribuição conjunta de pares (matriz sem diagonal), D = 0.
var Senado = (function () {
  function apurar(estado, dados, rngState) {
    var opcoes = (estado && estado.opcoes) || {};
    var disputaId = Comum.idv(dados.disputaId, "dados.disputaId");
    var vagas = dados.vagas;
    if (vagas === 1) {
      if (dados.validos1 !== undefined || dados.taxaInvalidos2 !== undefined) Comum.erro("Senado com 1 vaga: use validos, sem segundo voto");
      var r = Majoritaria.apurar(estado, { disputaId: disputaId, cargo: "SENADOR", vagas: 1, eleitorado: dados.eleitorado,
        validos: dados.validos, D: dados.D, tau: dados.tau, chapas: dados.chapas }, rngState);
      return r;
    }
    if (vagas !== 2) Comum.erro("Senado: 1 ou 2 vagas");
    if (dados.D !== undefined && dados.D !== 0) Comum.erro("Senado com 2 vagas: D = 0 (D70)");
    if (dados.tau !== undefined && dados.tau !== 1) Comum.erro("tau: estrutural 1 (4.2)");
    var eleitorado = Comum.inteiro(dados.eleitorado, "dados.eleitorado", 0);
    var validos1 = Comum.inteiro(dados.validos1, "dados.validos1", 1);
    if (validos1 > eleitorado) Comum.erro("validos1 excede o eleitorado");
    var taxa = Comum.real(dados.taxaInvalidos2, "taxaInvalidos2", 0, 1);
    if (!(taxa < 1)) Comum.erro("taxaInvalidos2 deve ser menor que 1");
    if (!Array.isArray(dados.chapas) || dados.chapas.length < 2) Comum.erro("Senado com 2 vagas: ao menos duas chapas");
    var vistos = new Set();
    var chapas = dados.chapas.map(function (c) {
      Comum.idv(c.id, "chapa.id");
      if (vistos.has(c.id)) Comum.erro("chapa repetida: " + c.id);
      vistos.add(c.id);
      return { id: c.id, S: Comum.real(c.S, "S de " + c.id, 0) };
    }).sort(Comum.porId);

    // primeiro voto (4.2, τ = 1, D = 0)
    var v1 = MaiorResto.distribuir(validos1, chapas.map(function (c) { return { id: c.id, peso: c.S }; }));
    // segundo voto: validos1 = validos2 + invalidos2
    var p2 = MaiorResto.distribuir(validos1, [{ id: "validos2", peso: 1 - taxa }, { id: "invalidos2", peso: taxa }]);
    var validos2 = p2.validos2, invalidos2 = p2.invalidos2;
    // linhas reduzidas na mesma proporção: validos2 repartido entre as linhas por v1_c
    var linhas = validos2 > 0 ? MaiorResto.distribuir(validos2, chapas.map(function (c) { return { id: c.id, peso: v1[c.id] }; })) : null;
    var segundo = new Map(), matriz = Object.create(null);
    chapas.forEach(function (c) { segundo.set(c.id, 0); });
    chapas.forEach(function (c) {
      var n = linhas ? linhas[c.id] : 0;
      matriz[c.id] = Object.create(null);
      if (n === 0) return;
      var outros = chapas.filter(function (d) { return d.id !== c.id; });
      if (outros.every(function (d) { return d.S === 0; })) Comum.erro("segundo voto sem outro candidato com pontuação positiva: " + c.id);
      var row = MaiorResto.distribuir(n, outros.map(function (d) { return { id: d.id, peso: d.S }; }));
      outros.forEach(function (d) { matriz[c.id][d.id] = row[d.id]; segundo.set(d.id, segundo.get(d.id) + row[d.id]); });
    });
    var votos = Object.create(null), soma2 = 0;
    chapas.forEach(function (c) { votos[c.id] = v1[c.id] + segundo.get(c.id); soma2 += segundo.get(c.id); });
    if (soma2 !== validos2) throw new Error("soma das segundas escolhas diferente de validos2");

    var ctx = { disputaId: disputaId, resolver: opcoes.resolverDesempateTecnico, rng: rngState, desempates: [] };
    var eleitos = Majoritaria.classificar(chapas, votos, 2, ctx, "senado");
    var out = { disputaId: disputaId, cargo: "SENADOR", vagas: 2, validos1: validos1, validos2: validos2, invalidos2: invalidos2,
      validos: validos1 + validos2, votos: votos, primeiroVoto: v1, segundoVoto: matriz, votosNaoModelados: 0,
      regra: "maioriaSimples", segundoTurno: false, eleitos: eleitos, finalistas: null, desempates: ctx.desempates };
    return { resultado: JSON.parse(JSON.stringify(out)), rngStateNext: ctx.rng };
  }
  return Object.freeze({ apurar: apurar });
})();

// Módulo 12: segundo turno (6.3; D70). Executa a disputa entre os finalistas decididos pelo módulo 11.
// Estágio 1: seções não instaladas do 2º turno (contingente informado, ou o do 1º turno). Estágio 2: matriz origem e
// destino sobre o eleitorado restante, cada origem repartida por maior resto entre A, B, brancoNulo e abstencao, com
// peso positivo nos quatro destinos. Estágio 3: brancoNulo2 repartido entre as cinco parcelas não válidas da D59 pelas
// proporções históricas do 2º turno. Identidades conferidas. Sem sorteio próprio; empate vai ao resolvedor injetado.
var SegundoTurno = (function () {
  var DESTINOS = ["A", "B", "brancoNulo", "abstencao"];
  var INVALIDOS = ["brancos", "nulos", "anulados", "anuladosSubJudice", "anuladosApuracaoSeparada"];
  var BNA = "brancoNuloAnulado", ABST = "abstencao", NM = "naoModelados:D";

  function proporcoes(p, campo) {
    if (!p || typeof p !== "object") Comum.erro(campo + ": obrigatórias");
    if (Object.keys(p).sort().join("|") !== INVALIDOS.slice().sort().join("|")) Comum.erro(campo + ": parcelas esperadas " + INVALIDOS.join(", "));
    var exatas = INVALIDOS.every(function (n) { return p[n] && typeof p[n] === "object"; });
    if (exatas) {
      var den = Comum.inteiro(p[INVALIDOS[0]].denominador, campo + ".denominador", 1);
      return INVALIDOS.map(function (n) {
        if (p[n].denominador !== den) Comum.erro(campo + ": denominadores diferentes");
        return { id: n, peso: Comum.inteiro(p[n].numerador, campo + "." + n + ".numerador", 0) };
      });
    }
    return INVALIDOS.map(function (n) { return { id: n, peso: Comum.real(p[n], campo + "." + n, 0) }; });
  }

  function apurar(estado, dados, rngState) {
    var opcoes = (estado && estado.opcoes) || {};
    var disputaId = Comum.idv(dados.disputaId, "dados.disputaId");
    var eleitorado = Comum.inteiro(dados.eleitorado, "dados.eleitorado", 1);
    var t1 = dados.primeiroTurno;
    if (!t1 || typeof t1 !== "object" || !t1.votos || typeof t1.votos !== "object") Comum.erro("primeiroTurno com votos obrigatório");
    if (!Array.isArray(dados.finalistas) || dados.finalistas.length !== 2 || dados.finalistas[0] === dados.finalistas[1]) Comum.erro("dois finalistas distintos");
    var A = dados.finalistas[0], B = dados.finalistas[1];
    var cands = Object.keys(t1.votos).sort();
    cands.forEach(function (c) { Comum.idv(c, "candidato do 1º turno"); Comum.inteiro(t1.votos[c], "votos de " + c, 0); });
    if (!Object.prototype.hasOwnProperty.call(t1.votos, A) || !Object.prototype.hasOwnProperty.call(t1.votos, B)) Comum.erro("finalista sem votos no 1º turno");
    if (cands.indexOf(BNA) >= 0 || cands.indexOf(ABST) >= 0 || cands.indexOf(NM) >= 0) Comum.erro("candidato com id reservado");
    var nm1 = t1.votosNaoModelados === undefined ? 0 : Comum.inteiro(t1.votosNaoModelados, "votosNaoModelados", 0);
    var inval1 = INVALIDOS.reduce(function (a, n) { return a + Comum.inteiro(t1[n], "primeiroTurno." + n, 0); }, 0);
    var abst1 = Comum.inteiro(t1.abstencao, "primeiroTurno.abstencao", 0);
    var sec1 = Comum.inteiro(t1.eleitoresSecoesNaoInstaladas, "primeiroTurno.eleitoresSecoesNaoInstaladas", 0);
    var validos1 = cands.reduce(function (a, c) { return a + t1.votos[c]; }, 0) + nm1;
    if (validos1 + inval1 + abst1 + sec1 !== eleitorado) Comum.erro("1º turno não fecha com o eleitorado (D59, 1 voto por eleitor)");

    // estágio 1
    var sec2 = dados.eleitoresSecoesNaoInstaladas2 === undefined ? sec1 : Comum.inteiro(dados.eleitoresSecoesNaoInstaladas2, "eleitoresSecoesNaoInstaladas2", 0);
    var abstOrigem = abst1 + sec1 - sec2;
    if (abstOrigem < 0) Comum.erro("seções não instaladas do 2º turno excedem abstenção e seções do 1º turno");

    // estágio 2
    var origens = cands.map(function (c) { return { id: c, n: t1.votos[c] }; });
    if (nm1 > 0) origens.push({ id: NM, n: nm1 });
    origens.push({ id: BNA, n: inval1 }, { id: ABST, n: abstOrigem });
    var pesos = dados.pesos;
    if (!pesos || typeof pesos !== "object") Comum.erro("pesos obrigatórios");
    var conhecidas = new Set(origens.map(function (o) { return o.id; }));
    Object.keys(pesos).forEach(function (k) { if (!conhecidas.has(k)) Comum.erro("pesos de origem desconhecida: " + k); });
    var tot = Object.create(null), transf = Object.create(null);
    DESTINOS.forEach(function (d) { tot[d] = 0; });
    origens.forEach(function (o) {
      if (o.n === 0) return;
      var p = Comum.proprio(pesos, o.id);
      if (!p || typeof p !== "object" || Object.keys(p).sort().join("|") !== DESTINOS.slice().sort().join("|")) Comum.erro("pesos da origem " + o.id + ": destinos A, B, brancoNulo, abstencao");
      DESTINOS.forEach(function (d) {
        Comum.real(p[d], "peso " + o.id + "→" + d, 0);
        if (!(p[d] > 0)) Comum.erro("origem " + o.id + " transfere integralmente: peso de " + d + " deve ser positivo");
      });
      var r = MaiorResto.distribuir(o.n, DESTINOS.map(function (d) { return { id: d, peso: p[d] }; }));
      transf[o.id] = r;
      DESTINOS.forEach(function (d) { tot[d] += r[d]; });
    });

    // estágio 3
    var validos2 = tot.A + tot.B;
    var comparecimento2 = eleitorado - tot.abstencao - sec2;
    if (comparecimento2 !== validos2 + tot.brancoNulo) throw new Error("matriz não fecha com o eleitorado");
    var parc = INVALIDOS.reduce(function (o, n) { o[n] = 0; return o; }, Object.create(null));
    if (tot.brancoNulo > 0) {
      var pp = proporcoes(dados.proporcoesInvalidos2, "proporcoesInvalidos2");
      if (pp.every(function (x) { return x.peso === 0; })) Comum.erro("proporcoesInvalidos2 todas nulas com brancoNulo positivo");
      var r3 = MaiorResto.distribuir(tot.brancoNulo, pp);
      INVALIDOS.forEach(function (n) { parc[n] = r3[n]; });
    }
    if (comparecimento2 + tot.abstencao + sec2 !== eleitorado) throw new Error("identidade do eleitorado violada");
    if (validos2 + INVALIDOS.reduce(function (a, n) { return a + parc[n]; }, 0) !== comparecimento2) throw new Error("identidade D59 violada");

    var ctx = { disputaId: disputaId, resolver: opcoes.resolverDesempateTecnico, rng: rngState, desempates: [] };
    var eleito = tot.A > tot.B ? A : tot.B > tot.A ? B : Comum.resolver(ctx, [A, B], { tipo: "segundoTurno", disputaId: disputaId });
    var votos = {}; votos[A] = tot.A; votos[B] = tot.B;
    var out = { disputaId: disputaId, finalistas: [A, B], votos: votos, validos: validos2, comparecimento: comparecimento2,
      abstencao: tot.abstencao, eleitoresSecoesNaoInstaladas: sec2, eleitorado: eleitorado, eleito: eleito,
      transferencias: transf, desempates: ctx.desempates };
    INVALIDOS.forEach(function (n) { out[n] = parc[n]; });
    return { resultado: JSON.parse(JSON.stringify(out)), rngStateNext: ctx.rng };
  }
  return Object.freeze({ apurar: apurar, ID_BRANCO_NULO_ANULADO: BNA, ID_ABSTENCAO: ABST, ID_NAO_MODELADOS: NM });
})();

// Módulo 2: cadastro de listas proporcionais e chapas majoritárias (5.1, 5.2, 6, 6.1; D71).
var Cadastro = (function () {
  function federacoesValidas(lista, partidos) {
    var dono = new Map(), feds = new Map();
    (lista || []).forEach(function (f) {
      var fed = Dados.federacao(f);
      if (partidos.has(fed.id) || feds.has(fed.id)) Comum.erro("federação com id repetido ou igual a partido: " + fed.id);
      fed.partidos.forEach(function (p) {
        if (!partidos.has(p)) Comum.erro("federação " + fed.id + " com partido não cadastrado: " + p);
        if (dono.has(p)) Comum.erro("partido em duas federações: " + p);
        dono.set(p, fed.id);
      });
      feds.set(fed.id, fed.partidos);
    });
    return { dono: dono, feds: feds };
  }
  function conjuntoPartidos(ids) {
    if (!Array.isArray(ids) || ids.length === 0) Comum.erro("partidos obrigatórios");
    var s = new Set();
    ids.forEach(function (p) { Comum.idv(p, "partido"); if (s.has(p)) Comum.erro("partido repetido: " + p); s.add(p); });
    return s;
  }
  function identificacao(ident, semId, partidos) {
    if (!ident || typeof ident !== "object") Comum.erro("identPartidaria obrigatória");
    var soma = 0;
    Object.keys(ident).forEach(function (p) {
      if (!partidos.has(p)) Comum.erro("identificação de partido não cadastrado: " + p);
      soma += Comum.real(ident[p], "identPartidaria de " + p, 0, 1);
    });
    var s = Comum.real(semId, "semIdentificacao", 0, 1);
    if (Math.abs(soma + s - 1) > Comum.TOL) Comum.erro("identificação partidária e semIdentificacao não somam 1");
    return function (p) { return Object.prototype.hasOwnProperty.call(ident, p) ? ident[p] : 0; };
  }

  // Lista = partido não federado ou federação; identificação da federação = soma dos membros; sem coligação proporcional.
  function montarListasProporcionais(estado, dados, rngState) {
    if (dados.coligacoes !== undefined) Comum.erro("coligação não existe em proporcional");
    var partidos = conjuntoPartidos(dados.partidos);
    var fx = federacoesValidas(dados.federacoes, partidos);
    var id = identificacao(dados.identPartidaria, dados.semIdentificacao, partidos);
    var listas = new Map();
    partidos.forEach(function (p) {
      var lid = fx.dono.has(p) ? fx.dono.get(p) : p;
      if (!listas.has(lid)) listas.set(lid, { id: lid, membros: fx.feds.has(lid) ? fx.feds.get(lid).slice() : [p], identPartidaria: 0, candidatos: [] });
      listas.get(lid).identPartidaria += id(p);
    });
    if (dados.listasDeclaradas !== undefined) {
      if (!Array.isArray(dados.listasDeclaradas)) Comum.erro("listasDeclaradas deve ser lista");
      dados.listasDeclaradas.forEach(function (l) {
        if (fx.dono.has(l)) Comum.erro("partido federado não pode ser lista própria: " + l);
        if (!listas.has(l)) Comum.erro("lista declarada inexistente ou agrupamento sem federação: " + l);
      });
    }
    var vistos = new Set();

// Módulo 5: opinião (4.6; D71). opiniao_c = clamp(popularidade + α × semOpiniao − k × rejeicao, 0, 1).
// A identificação partidária não entra aqui (só no segmento fiel do módulo 9 e em identChapa do módulo 2).

// Módulo 7: campanha e alocações (4.4, 7.1 a 7.5; D71). Valores monetários em inteiros (centavos).
var Campanha = (function () {
  function efeitoMobilizacao(R, escalaGasto) {

// Módulo 6: máquina efetiva (4.5, 6.1; D71). Quatro componentes combinados por complemento, cada ator em cada canal
// uma vez. estruturaAliada recebida como valor (função a calibrar). Transferência: um sorteio por par (liderança,
// candidato, eleição) num subfluxo derivado da semente.
var Maquina = (function () {
  function unicos(lista, campo) {
    var s = new Set();
    (lista || []).forEach(function (x) { Comum.idv(x, campo); if (s.has(x)) Comum.erro(campo + ": ator repetido no canal: " + x); s.add(x); });

    var efeitoMob = Campanha.efeitoMobilizacao(aloc + mobAliada, dados.escalaGasto);

      if (lids.has(l.id)) Comum.erro("liderança repetida no canal de transferência: " + l.id);
      lids.add(l.id);

// Módulo 3: elegibilidade e composição das listas (regras-e-mundo.md 1; GDD 3; D72). Antes da eleição.
var Elegibilidade = (function () {
  var IDADE = { VEREADOR: [18, "registro"], DEPUTADO_ESTADUAL: [21, "posse"], DEPUTADO_DISTRITAL: [21, "posse"],

      if (vistas.has(l.id)) Comum.erro("lista repetida: " + l.id);
      vistas.add(l.id);
      var membros = new Set(Array.isArray(l.membros) ? l.membros : Comum.erro("lista " + l.id + ": membros obrigatórios"));
      var aptos = [], inelegiveis = [];
      (l.candidatos || []).forEach(function (c) {
        Comum.idv(c.id, "candidato.id");
        if (cands.has(c.id)) Comum.erro("candidato repetido: " + c.id);
        cands.add(c.id);

        if (Datas.idade(Datas.ler(c.dataNascimento, "dataNascimento de " + c.id), ref) < IDADE[cargo][0]) motivos.push("idadeMinima");
        if (!membros.has(c.partidoId)) Comum.erro("candidato " + c.id + " de partido fora da lista " + l.id);
        if (Datas.cmp(Datas.ler(c.dataFiliacao, "dataFiliacao de " + c.id), prazoFiliacao) > 0) motivos.push("filiacaoForaDoPrazo");

        if (c.inelegibilidadeReconhecida !== undefined && typeof c.inelegibilidadeReconhecida !== "boolean") Comum.erro("inelegibilidadeReconhecida de " + c.id + ": booleano");

        if (c.nomeacaoGovernamental !== undefined && typeof c.nomeacaoGovernamental !== "boolean") Comum.erro("nomeacaoGovernamental de " + c.id + ": booleano");
        if (c.nomeacaoGovernamental === true) motivos.push("semDesincompatibilizacao");

// Módulo 15: posse, suplência e vacância (5.4 itens 9 e 10; D55; D72). Depois da apuração.
var Posse = (function () {
  var PROPORCIONAIS = { VEREADOR: true, DEPUTADO_ESTADUAL: true, DEPUTADO_DISTRITAL: true, DEPUTADO_FEDERAL: true };
  var VICE = { PREFEITO: true, GOVERNADOR: true, PRESIDENTE: true };
  function empossar(estado, dados, rngState) {
    var cargo = dados.cargo;
    if (typeof cargo !== "string" || !Object.prototype.hasOwnProperty.call(Dados.CARGOS, cargo)) Comum.erro("cargo desconhecido");
    var inicio = Datas.ler(dados.dataPosse, "dataPosse"), fim = Datas.ler(dados.fimMandato, "fimMandato");
    if (Datas.cmp(inicio, fim) >= 0) Comum.erro("fim do mandato deve ser posterior à posse");
    if (!Array.isArray(dados.eleitos) || dados.eleitos.length === 0) Comum.erro("eleitos obrigatórios");
    var vistos = new Set();
    var ocupantes = dados.eleitos.map(function (e) {
      Comum.idv(e, "eleito");
      if (vistos.has(e)) Comum.erro("eleito repetido: " + e);
      vistos.add(e);
      return { cargo: cargo, titularId: e, emExercicio: e, inicio: dados.dataPosse, fim: dados.fimMandato };
    });
    return { resultado: JSON.parse(JSON.stringify({ disputaId: Comum.idv(dados.disputaId, "disputaId"), ocupantes: ocupantes })), rngStateNext: rngState };
  }
  // tipo "convocacao": suplente assume o exercício e o titular mantém o mandato (D55); "definitiva": vaga aberta.
  // Sem suplente, só na vaga definitiva: nova eleição, salvo se faltarem menos de N meses para o fim do mandato
  // (deputados 15, Res. 23.677, art. 15; vereador: lei orgânica ou, sem ela, 9, Código Eleitoral, art. 113).
  function vacancia(estado, dados, rngState) {
    var cargo = dados.cargo;
    if (typeof cargo !== "string" || !Object.prototype.hasOwnProperty.call(Dados.CARGOS, cargo)) Comum.erro("cargo desconhecido");
    if (VICE[cargo]) Comum.erro("vacância de cargo majoritário com vice fora da etapa 6 (D72): linha sucessória não documentada");
    if (!PROPORCIONAIS[cargo] && cargo !== "SENADOR") Comum.erro("cargo sem regra de vacância nesta etapa");
    if (dados.tipo !== "convocacao" && dados.tipo !== "definitiva") Comum.erro("tipo: convocacao ou definitiva");
    var titular = Comum.idv(dados.titularId, "titularId");
    var data = Datas.ler(dados.dataEvento, "dataEvento"), fim = Datas.ler(dados.fimMandato, "fimMandato");
    if (Datas.cmp(data, fim) >= 0) Comum.erro("evento depois do fim do mandato");
    if (!Array.isArray(dados.suplentes)) Comum.erro("suplentes: lista ordenada obrigatória (módulo 10 ou chapa do Senado)");
    dados.suplentes.forEach(function (s) { Comum.idv(s, "suplente"); if (s === titular) Comum.erro("titular na lista de suplentes"); });
    var out = { cargo: cargo, titularId: titular, tipo: dados.tipo, dataEvento: dados.dataEvento };
    if (dados.suplentes.length > 0) {
      out.acao = dados.tipo === "convocacao" ? "suplenteConvocado" : "suplenteEfetivado";
      out.emExercicio = dados.suplentes[0];
      out.suplentesRestantes = dados.suplentes.slice(1);
      out.mandatoDoTitular = dados.tipo === "convocacao" ? "preservado" : "extinto";
    } else {
      if (cargo === "SENADOR") Comum.erro("Senado sem suplente: regra não documentada nesta etapa");
      if (dados.tipo === "convocacao") Comum.erro("afastamento sem suplente: sem regra documentada");
      var meses;
      if (cargo === "VEREADOR") {

        out.fonteDoPrazo = dados.mesesLeiOrganica === undefined ? "Código Eleitoral, art. 113 (simplificação do MVP, sem lei orgânica)" : "lei orgânica municipal";
      } else {

      }

      var semEleicao = Datas.cmp(Datas.somarMeses(data, meses), fim) > 0;
      out.acao = semEleicao ? "vagaSemPreenchimento" : "eleicaoSuplementar";

})();

// Módulo 16: fechamento do ciclo (8; 10; D72). Ordem obrigatória dos cinco passos, cada um por função injetada que
// recebe e devolve o estado político; a governabilidade calcula apoioEfetivo e folgaDeCusto e recebe as funções
// estabilidade, negociação e faixa injetadas (calibrar).
var Fechamento = (function () {
  var PASSOS = ["apuracaoEPosse", "atualizarMatrizes", "recalcularRecursos", "aplicarClausula", "abrirProximoCiclo"];
  var FAIXAS = ["critica", "fragil", "funcional", "solida"];
