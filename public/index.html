    ["estabilidade", "negociacao", "faixa"].forEach(function (f) { if (typeof opcoes[f] !== "function") Comum.erro(f + ": função injetada obrigatória (calibrar)"); });
    var total = Comum.inteiro(dados.totalCadeiras, "totalCadeiras", 1);
    var maioria = Comum.inteiro(dados.maioriaExigida, "maioriaExigida", 1);
    if (maioria > total) Comum.erro("maioriaExigida acima do total de cadeiras");
    var vistos = new Set(), soma = 0, apoio = 0;
    (dados.blocos || []).forEach(function (b) {
      Comum.idv(b.id, "bloco.id");
      if (vistos.has(b.id)) Comum.erro("bloco repetido: " + b.id);
      vistos.add(b.id);
      var c = Comum.inteiro(b.cadeiras, "cadeiras de " + b.id, 0);
      if (!Object.prototype.hasOwnProperty.call(ALINH, b.alinhamento)) Comum.erro("alinhamento inválido em " + b.id);
      var coesao = Comum.real(b.coesao, "coesao de " + b.id, 0, 1);
      soma += c;
      if (b.alinhamento === "aliado") apoio += c * coesao;
    });
    if (soma !== total) Comum.erro("cadeiras dos blocos diferentes do total");
    var custo = Comum.real(dados.custoManutencao, "custoManutencao", 0);
    if (!(custo > 0)) Comum.erro("custoManutencao deve ser positivo");
    var folga = Comum.real(dados.capitalEntrega, "capitalEntrega", 0) / custo;
    var ctx = { apoioEfetivo: apoio, razaoApoio: apoio / maioria, folgaDeCusto: folga, contexto: dados.contexto };
    var est = Comum.real(opcoes.estabilidade(ctx), "estabilidade injetada", 0, 1);
    var neg = Comum.real(opcoes.negociacao(ctx), "negociacao injetada", 0, 1);
    var faixa = opcoes.faixa({ apoioEfetivo: apoio, razaoApoio: apoio / maioria, folgaDeCusto: folga, estabilidade: est, negociacao: neg });
    if (FAIXAS.indexOf(faixa) < 0) Comum.erro("faixa injetada inválida: " + faixa);
    return { resultado: { apoioEfetivo: apoio, razaoApoio: apoio / maioria, folgaDeCusto: folga, estabilidade: est, negociacao: neg, faixa: faixa }, rngStateNext: rngState };
  }
  function executar(estado, dados, rngState) {
    var opcoes = (estado && estado.opcoes) || {};
    var passos = opcoes.passos || {};
    PASSOS.forEach(function (p) { if (typeof passos[p] !== "function") Comum.erro("passo " + p + ": função injetada obrigatória"); });
    var atual = dados.estadoPolitico, rng = rngState, registro = [];
    PASSOS.forEach(function (p, i) {
      var r = passos[p](atual, { ordem: i + 1, passosConcluidos: registro.slice(), dados: dados.contexto }, rng);
      if (!r || r.estadoPolitico === undefined) Comum.erro("passo " + p + " deve devolver { estadoPolitico, rngStateNext }");
      atual = r.estadoPolitico;
      if (r.rngStateNext !== undefined) rng = r.rngStateNext;
      registro.push(p);
    });
    return { resultado: { estadoPolitico: atual, passos: registro }, rngStateNext: rng };
  }
  return Object.freeze({ executar: executar, governabilidade: governabilidade, PASSOS: PASSOS, FAIXAS: FAIXAS });
})();

// Distribuição proporcional de cadeiras (módulo 10; regra: motor-eleitoral.md 5.4; desempates: 5.4 item 7 e 5.5).
// Contrato D67: distribuir(estado, dados, rngState) => { resultado, rngStateNext }. Sem RNG próprio: o estado de RNG
// só é repassado ao resolvedor de desempate técnico injetado (módulo 14) e devolvido como ele o deixar.
// Toda comparação de patamar e de média é exata em inteiros (BigInt); nenhuma divisão em ponto flutuante.
var Cadeiras = (function () {
  var MINIMOS_FASE2 = Object.freeze({ "0": 0n, "0.1": 1n }); // décimos do QE (D65)

  var erro = Comum.erro, inteiro = Comum.inteiro, idv = Comum.idv;

  // Código Eleitoral, art. 106: fração até meio desprezada, acima de meio arredondada para um.
  function quocienteEleitoral(validos, vagas) {
    inteiro(validos, "validos", 1); inteiro(vagas, "vagas", 1);
    var q = Math.floor(validos / vagas), r = validos - q * vagas;
    return 2 * r > vagas ? q + 1 : q;
  }

  // votos >= fração × QE, com fração em décimos (1 = 10%, 2 = 20%, 8 = 80%), exato.
  function atinge(votos, decimos, QE) { return 10n * BigInt(votos) >= decimos * BigInt(QE); }

  function validarEntrada(dados) {
    if (!dados || typeof dados !== "object") erro("dados obrigatórios");
    var disputaId = idv(dados.disputaId, "dados.disputaId");
    var vagas = inteiro(dados.vagas, "dados.vagas", 1);
    if (!Array.isArray(dados.listas) || dados.listas.length === 0) erro("dados.listas: ao menos uma lista");
    var ids = new Set(), cands = new Set();
    var listas = dados.listas.map(function (l) {
      var lid = idv(l.id, "lista.id");
      if (ids.has(lid)) erro("lista repetida: " + lid);
      ids.add(lid);
      var legenda = inteiro(l.votosLegenda, "lista." + lid + ".votosLegenda", 0);
      if (!Array.isArray(l.candidatos)) erro("lista." + lid + ".candidatos: lista obrigatória");
      var nominais = 0;
      var cs = l.candidatos.map(function (c) {
        var cid = idv(c.id, "candidato.id");
        if (cands.has(cid)) erro("candidato repetido: " + cid);
        cands.add(cid);
        nominais += inteiro(c.votos, "candidato." + cid + ".votos", 0);
        return { id: cid, votos: c.votos, idade: inteiro(c.idade, "candidato." + cid + ".idade", 0), listaId: lid };
      });
      var total = legenda + nominais;
      if (!Number.isSafeInteger(total)) erro("lista." + lid + ": votos fora do limite");
      return { id: lid, votosLegenda: legenda, votosLista: total, candidatos: cs };
    }).sort(function (a, b) { return a.id < b.id ? -1 : 1; });

  }

  function chamarResolvedor(ctx, empatados, contexto) {
    if (typeof ctx.resolver !== "function") throw new Error("desempate técnico necessário e nenhum resolvedor informado (módulo 14)");
    var ids = empatados.slice().sort();
    var r = ctx.resolver(ids, contexto, ctx.rng);
    if (!r || ids.indexOf(r.vencedorId) < 0) throw new Error("resolvedor de desempate devolveu vencedor fora dos empatados");
    ctx.rng = r.rngStateNext === undefined ? ctx.rng : r.rngStateNext;

    return r.vencedorId;
  }

  // Ordem única da lista: votos decrescentes, idade decrescente; persistindo, desempate técnico (5.4 item 7; 5.5).
  function ordenar(lista, ctx) {
    var cs = lista.candidatos.slice().sort(function (a, b) {
      if (a.votos !== b.votos) return b.votos - a.votos;
      if (a.idade !== b.idade) return b.idade - a.idade;
      return a.id < b.id ? -1 : 1;
    });
    var out = [];
    for (var i = 0; i < cs.length;) {
      var j = i;
      while (j < cs.length && cs[j].votos === cs[i].votos && cs[j].idade === cs[i].idade) j++;
      var grupo = cs.slice(i, j);
      while (grupo.length > 1) {
        var v = chamarResolvedor(ctx, grupo.map(function (c) { return c.id; }),
          { tipo: "candidatosLista", disputaId: ctx.disputaId, listaId: lista.id });
        out.push(grupo.filter(function (c) { return c.id === v; })[0]);
        grupo = grupo.filter(function (c) { return c.id !== v; });
      }
      out.push(grupo[0]);
      i = j;
    }
    return out;
  }

  // a/b comparado com c/d, exato.
  function cmpFracao(a, b, c, d) { var x = BigInt(a) * BigInt(d), y = BigInt(c) * BigInt(b); return x > y ? 1 : x < y ? -1 : 0; }

    if (!Object.prototype.hasOwnProperty.call(MINIMOS_FASE2, chaveMin)) erro("minimoNominalFase2: 0 ou 0.1 (D65)");
    var d = validarEntrada(dados);
    var ctx = { disputaId: d.disputaId, resolver: opcoes.resolverDesempateTecnico, rng: rngState, desempates: [] };
    var validos = d.listas.reduce(function (a, l) { return a + l.votosLista; }, 0);
    if (!Number.isSafeInteger(validos)) erro("votos válidos fora do limite");
    var QE = quocienteEleitoral(validos, d.vagas);

    });

    // no denominador da média (nota de implementação: Res. 23.677, art. 11, §§ 1º e 5º) e vai às sobras.

      var e = est[l.id];

      while (e.eleitos.length < e.QP && e.prox < e.ordem.length && atinge(e.ordem[e.prox].votos, 1n, QE)) {

      var fase1 = d.listas.filter(function (l) {
        var e = est[l.id];
        return atinge(l.votosLista, 8n, QE) && e.prox < e.ordem.length && atinge(e.ordem[e.prox].votos, 2n, QE);
      });

        break;
      }

      var melhor = [aptas[0]];
      for (var i = 1; i < aptas.length; i++) {

        if (c === 0) c = a.votosLista - b.votosLista;
        if (c === 0) c = ea.ordem[ea.prox].votos - eb.ordem[eb.prox].votos;
        if (c === 0) c = ea.ordem[ea.prox].idade - eb.ordem[eb.prox].idade;

      if (melhor.length > 1) {
        var reps = melhor.map(function (l) { return est[l.id].ordem[est[l.id].prox].id; });
        var vId = chamarResolvedor(ctx, reps, { tipo: "mediasListas", disputaId: d.disputaId, fase: fase,
          listas: melhor.map(function (l) { return l.id; }).sort() });
        vencedora = melhor.filter(function (l) { return est[l.id].ordem[est[l.id].prox].id === vId; })[0];
      }

      ev.eleitos.push(eleito.id); eleitos.push(eleito.id); ev.prox++; ev.obtidas++;
    }

    d.listas.forEach(function (l) {
      var e = est[l.id];
      if (e.eleitos.length > 0) {
        cadeiras[l.id] = e.eleitos.length;
        // suplentes só de lista que obteve vaga (Res. 23.677, art. 14), sem votação mínima (5.4 item 9)
        suplentes[l.id] = e.ordem.slice(e.prox).map(function (c) { return c.id; });

      listas: d.listas.map(function (l) { var e = est[l.id]; return { id: l.id, votos: l.votosLista, quocientePartidario: e.QP,

})();


/* == ORQUESTRADOR == */
// Módulo 14: desempate técnico (5.5; D66; D73). Contrato dos módulos 10 a 13: (empatadosIds, contexto, rngState) =>

    var pc = contexto.pesos ? Comum.real(contexto.pesos.carisma, "peso de carisma", 0, 1) : 0.5;
    var pf = contexto.pesos ? Comum.real(contexto.pesos.financeiro, "peso financeiro", 0, 1) : 0.5;
    if (Math.abs(pc + pf - 1) > Comum.TOL) Comum.erro("pesos do desempate não somam 1");
    function fracoes(campo) {
      var soma = 0, v = Object.create(null);

      var k = c.custo && c.custo.compromisso;
      if (k && k.retaliacao && !ids.has(k.retaliacao.eventoId)) erro("carta " + c.id + ": retaliação para evento desconhecido " + k.retaliacao.eventoId);
    });
    var m = new Map(); evs.forEach(function (ev) { m.set(ev.id, ev); });
    return m;
  }

  function transicao(e, ev, j) {
    var p = e.personagem;
    if (j === "investigar") { p.statusJuridico = "investigado"; p.denunciaRegistrada = false; }
    else if (j === "arquivar") { p.statusJuridico = "regular"; p.denunciaRegistrada = false; }
    else if (j === "denunciar") p.denunciaRegistrada = true;

  }

  // Passo 3 da janela. Primeiro todos os sorteios e disparos sobre o estado de abertura; depois as opções, em ordem
  // (fila por id, depois gatilhos por id). Assim a lista de pendências da prévia não depende das escolhas.
  function resolverJanela(estado, dados, ctx) {

    var e = JSON.parse(JSON.stringify(estado)), t = e.tempo, rng = RNG.validar(e.rng.eventos), oc = [], pend = [];
    var disparados = [];
    var vencidos = e.filaEventos.filter(function (x) { return x.janelaAlvo.ano === t.ano && x.janelaAlvo.janela === t.janela; }).sort(Comum.porId);
    e.filaEventos = e.filaEventos.filter(function (x) { return !(x.janelaAlvo.ano === t.ano && x.janelaAlvo.janela === t.janela); });
    vencidos.forEach(function (it) {
      var ev = cat.get(it.dados && it.dados.eventoId) || erro("evento desconhecido na fila: " + (it.dados && it.dados.eventoId));
      var u = RNG.decimal(rng); rng = u.rngStateNext;
      var cond = vale(e, ev.condicao) && vale(e, validarCondicao(it.dados.condicao, "condicao do item " + it.id));
      if (cond && u.valor < it.dados.prob) disparados.push({ id: it.id, ev: ev, item: it });
      else {
        oc.push({ tipo: "eventoNaoDisparou", id: it.id });

          var n = (it.dados.reagendamentos || 0) + 1, base = it.dados.idBase || it.id;
          e.filaEventos.push({ id: base + ":r" + n, janelaAlvo: Carreira.deslocar(t, ev.reagendar.emJanelas),
            dados: Object.assign({}, it.dados, { prob: Math.min(ev.reagendar.probMax, it.dados.prob + ev.reagendar.incrementoProb), reagendamentos: n, idBase: base }) });
        }

      var u = RNG.decimal(rng); rng = u.rngStateNext;
      var x = ler(e, ev.limiar.alvo), ultima = Comum.proprio(e.eventosRecentes, ev.familia);
      var bloqueado = ultima && ev.bloqueioJanelas && Carreira.cmpTempo(t, Carreira.deslocar(ultima, ev.bloqueioJanelas)) < 0;
      var habilitado = testa(x, ev.limiar.op, ev.limiar.valor) && vale(e, ev.condicao) && !bloqueado;
      var chance = ev.probBase * Math.min(1, Math.abs(x - ev.limiar.valor) / ev.limiar.escala);
      if (habilitado && u.valor < chance) disparados.push({ id: ev.id + ":" + t.ano + t.janela, ev: ev, item: null });
    });
    e.rng.eventos = rng;
    var dec = (ctx.decisoes && ctx.decisoes.eventos) || {};
    disparados.forEach(function (d) {
      var ops = d.ev.opcoes, op;
      if (ops.length === 1) op = ops[0];
      else if (!ctx.manual) op = ops.filter(function (o) { return o.contencao === true; })[0];
      else {
        var esc = Comum.proprio(dec, d.id);
        op = ops.filter(function (o) { return o.id === esc; })[0];
        if (!op) {
          if (!ctx.previa) erro("decisão ausente ou inválida para o evento " + d.id);
          pend.push({ id: d.id, eventoId: d.ev.id, titulo: d.ev.titulo, texto: d.ev.texto,
            opcoes: ops.map(function (o) { return { id: o.id, texto: o.texto, contencao: o.contencao === true }; }) });
          op = ops.filter(function (o) { return o.contencao === true; })[0]; // provisória, só na prévia
        }
      }
      Cartas.aplicarEfeitos(e, op.efeitos || []);
      if (op.juridico) transicao(e, d.ev, op.juridico);
      if (op.encerrarNomeacao && Nomeacoes.encerrar(e, "evento:" + d.ev.id)) oc.push({ tipo: "nomeacaoEncerrada", motivo: "evento", eventoId: d.ev.id });
      if (op.estadoTemporario) e.personagem.estadosTemporarios.push({ id: d.id + ":" + op.estadoTemporario.tipo, tipo: op.estadoTemporario.tipo,
        origem: d.ev.id, inicio: { ano: t.ano, janela: t.janela }, fim: Carreira.deslocar(t, op.estadoTemporario.duracaoJanelas) });
      if (op.agendar) e.filaEventos.push({ id: d.id + ":" + op.agendar.eventoId, janelaAlvo: Carreira.deslocar(t, op.agendar.emJanelas),
        dados: { eventoId: op.agendar.eventoId, origemEventoId: d.ev.id, prob: op.agendar.prob, condicao: null,
          nivelCorrupcao: d.item ? d.item.dados.nivelCorrupcao : null } });
      e.eventosRecentes[d.ev.familia] = { ano: t.ano, janela: t.janela };

      oc.push({ tipo: "evento", id: d.id, eventoId: d.ev.id, opcaoId: op.id });

})();

/* == CANDIDATURA == */
// Candidatura em J3 e ficha de oportunidade (carreira-e-poder 7, 8 e 10.5; GDD 3 e 4; D78). Sem RNG: a oferta nasce do
// cruzamento entre modelo de disputa, módulo 3, saldo e condições declarativas do catálogo. Capital político não é
// calculado: as condições usam os componentes (regra de não duplicação, carreira-e-poder 1).
var Candidatura = (function () {
  var erro = Comum.erro;
  var LOCAIS = { VEREADOR: true, PREFEITO: true };
  var PROPORCIONAL = { VEREADOR: true, DEPUTADO_ESTADUAL: true, DEPUTADO_DISTRITAL: true, DEPUTADO_FEDERAL: true };
  function escopoDe(cargo) { return LOCAIS[cargo] ? "local" : cargo === "PRESIDENTE" ? "nacional" : "estadual"; }
  // "escopo.notoriedade" vira o indicador do escopo do cargo (GDD 5; eventos-e-risco 2.1)
  function resolverCondicao(cond, cargo) {
    return (cond || []).map(function (c) {
      var m = /^escopo\.(notoriedade|popularidade|rejeicao)$/.exec(c.alvo);
      return m ? { alvo: "indicadores." + escopoDe(cargo) + "." + m[1], op: c.op, valor: c.valor } : c;
    });
  }
  function validarCatalogo(dados) {
    var ops = dados.oportunidades;
    if (!Array.isArray(ops) || ops.length === 0) erro("oportunidades: catálogo não vazio");
    var ids = new Set();
    ops.forEach(function (o) {
      var campo = "oportunidade " + Comum.idv(o && o.id, "oportunidade.id");
      if (ids.has(o.id)) erro(campo + " repetida"); ids.add(o.id);
      if (o.tipo !== "proporcional" && o.tipo !== "cabecaDeChapa") erro(campo + ".tipo: proporcional ou cabecaDeChapa");
      if (!Array.isArray(o.cargos) || o.cargos.length === 0) erro(campo + ".cargos: lista não vazia");
      o.cargos.forEach(function (c) {
        if (!Object.prototype.hasOwnProperty.call(Dados.CARGOS, c)) erro(campo + ": cargo desconhecido " + c);
        if (!!PROPORCIONAL[c] !== (o.tipo === "proporcional")) erro(campo + ": cargo " + c + " incompatível com o tipo " + o.tipo);
        Eventos.validarCondicao(resolverCondicao(o.condicao, c), campo + ".condicao");
      });
      if (o.custo !== null && o.custo !== undefined) {
        // em J3 só Caixa Pessoal: Fundo de Campanha só a partir de J4 (D76, D78)
        if (o.custo.recurso !== "caixaPessoal") erro(campo + ".custo: só caixaPessoal em J3");
        Comum.inteiro(o.custo.quantidade, campo + ".custo.quantidade", 1);
      }
      if (typeof o.risco !== "string" || o.risco === "") erro(campo + ".risco: texto descritivo obrigatório");
    });
    var rc = dados.regrasCargo || erro("regrasCargo obrigatório (calibrar)");
    var amb = dados.ambicoesCargos || erro("ambicoesCargos obrigatório");
    Object.keys(amb).forEach(function (a) { if (!Array.isArray(amb[a])) erro("ambicoesCargos." + a + ": lista de cargos"); });
    var gov = dados.governos || erro("governos obrigatório (posição na coalizão)");
    return { rc: rc, amb: amb, gov: gov };
  }

  function mandatoAtual(e) {
    var ms = e.cargos.mandatos.filter(function (m) { return m.situacao === "exercicio"; });
    if (ms.length === 0) return undefined;
    var atual = ms[ms.length - 1];
    // mandatos consecutivos no mesmo cargo e unidade: o seguinte começa no ano do fim do anterior ou no ano seguinte
    var mesmos = e.cargos.mandatos.filter(function (m) { return m.cargo === atual.cargo && m.unidadeId === atual.unidadeId && m.situacao !== "eleito"; })
      .sort(function (a, b) { return a.inicio < b.inicio ? -1 : 1; });
    var n = 1;
    for (var i = mesmos.length - 1; i > 0; i--) {
      var gap = Number(mesmos[i].inicio.slice(0, 4)) - Number(mesmos[i - 1].fim.slice(0, 4));
      if (mesmos[i].inicio > mesmos[i - 1].fim && gap <= 1) n++; else break;
    }
    return { cargo: atual.cargo, unidadeId: atual.unidadeId, consecutivos: n };
  }
  function unidadeDoPersonagem(e, cargo, modelo) {
    if (LOCAIS[cargo]) return e.personagem.municipioLocal;
    if (cargo === "PRESIDENTE") return modelo.disputa.unidadeId; // país
    return e.personagem.ufInicial;
  }
  function listaDoPartido(modelo, partidoId) {
    var f = (modelo.federacoes || []).filter(function (x) { return x.partidos.indexOf(partidoId) >= 0; })[0];
    return f ? { id: f.id, membros: f.partidos } : { id: partidoId, membros: [partidoId] };
  }
  function candidatoBase(e) {
    var p = e.personagem;
    return { id: p.id, partidoId: p.partidoId, dataNascimento: p.dataNascimento, dataFiliacao: p.dataFiliacao,
      mandatoAtual: mandatoAtual(e), inelegibilidadeReconhecida: p.statusJuridico === "inelegibilidadeReconhecida",
      nomeacaoGovernamental: e.cargos.nomeacoes.some(function (n) { return n.situacao === "exercicio" && n.tipo === "governamental"; }) };
  }
  function aptoNoModulo3(e, modelo, lista) {
    var c = candidatoBase(e);
    if (c.mandatoAtual === undefined) delete c.mandatoAtual;
    var r = Elegibilidade.avaliar({}, { cargo: modelo.disputa.cargo, unidadeId: modelo.disputa.unidadeId, calendario: modelo.calendario,
      limiteLista: 1, listas: [{ id: lista.id, membros: lista.membros, candidatos: [c] }] }, null).resultado;
    return r.listas[0].aptos.length === 1;
  }

  // Ofertas da J3: cada par (modelo do ano, regra do catálogo) em que tudo vale. Ordem por id da oferta.
  function ofertas(e, dados) {
    var cfg = validarCatalogo(dados), t = e.tempo, p = e.personagem, out = [];
    if (!p.partidoId) return out;
    var modelos = Comum.proprio(dados.modelosDisputa, String(t.ano)) || [];
    if (!Array.isArray(modelos)) erro("modelosDisputa." + t.ano + ": lista");
    if (e.candidaturas.some(function (c) { return c.ano === t.ano; })) return out; // uma candidatura por ano
    modelos.forEach(function (mo) {
      var d = Dados.disputa(mo.disputa), cargo = d.cargo;
      if (d.ano !== t.ano) erro("modelo " + d.id + " de outro ano");
      if (d.unidadeId !== unidadeDoPersonagem(e, cargo, mo)) return;
      if (!(mo.partidos || []).some(function (x) { return (typeof x === "string" ? x : x.id) === p.partidoId; })) return;
      var lista = listaDoPartido(mo, p.partidoId);
      dados.oportunidades.forEach(function (o) {
        if (o.cargos.indexOf(cargo) < 0) return;
        if (!Eventos.vale(e, resolverCondicao(o.condicao, cargo))) return;
        if (o.custo && e.bolsos.caixaPessoal < o.custo.quantidade) return;
        var alvoId;
        if (o.tipo === "proporcional") {
          var na = (mo.candidatos || []).filter(function (c) { return lista.membros.indexOf(c.partidoId) >= 0; }).length;
          if (na >= Comum.inteiro(mo.limiteLista, "limiteLista do modelo " + d.id, 0)) return;
          alvoId = lista.id;
        } else {
          var ch = (mo.chapas || []).filter(function (c) { return c.titular === lista.id || c.titular === p.partidoId; })[0];
          if (!ch) return;
          alvoId = ch.id;
        }
        if (!aptoNoModulo3(e, mo, lista)) return;
        var esc = escopoDe(cargo), regra = Comum.proprio(cfg.rc, cargo) || erro("regrasCargo sem o cargo " + cargo + " (calibrar)");
        var ambs = p.ambicao.filter(function (a) { return (Comum.proprio(cfg.amb, a) || []).indexOf(cargo) >= 0; }).length;
        var posGov = Comum.proprio(Comum.proprio(cfg.gov, esc) || {}, p.partidoId) || "semInformacao";
        out.push({ id: o.id + ":" + d.id, oportunidadeId: o.id, tipo: o.tipo, disputaId: d.id, cargo: cargo, unidadeId: d.unidadeId,
          partidoId: p.partidoId, listaOuChapaId: alvoId, custo: o.custo || null,
          ficha: { eleitoradoAlcancado: mo.eleitorado, exposicaoEsperada: regra.exposicao, recursoPolitico: regra.capitalEntregaPorCiclo,
            posicaoCoalizao: posGov, papelEsperado: e.indicadores[esc].notoriedade >= regra.notoriedadeProtagonista ? "protagonista" : "coadjuvante",
            custo: o.custo || null, risco: o.risco, aderenciaAmbicao: ambs } });
      });
    });
    return out.sort(Comum.porId);
  }

  function registrar(estado, oferta) {
    var e = JSON.parse(JSON.stringify(estado)), t = e.tempo;
    if (oferta.custo) e.bolsos.caixaPessoal -= oferta.custo.quantidade;
    e.candidaturas.push({ ano: t.ano, ofertaId: oferta.id, disputaId: oferta.disputaId, cargo: oferta.cargo, unidadeId: oferta.unidadeId,
      partidoId: oferta.partidoId, listaOuChapaId: oferta.listaOuChapaId, tipo: oferta.tipo });
    e.historico.push({ ano: t.ano, janela: t.janela, tipo: "candidatura", ofertaId: oferta.id, disputaId: oferta.disputaId });
    return e;
  }

  // Máquina do personagem (motor-eleitoral 4.5): base própria da carreira; demais componentes do modelo (calibrar).
  function maquinaDe(e, mo) {
    var mp = mo.maquinaPersonagem || erro("modelo " + mo.disputa.id + ": maquinaPersonagem obrigatória");
    var base = e.base.municipios;
    function municipal(municipioId, tpl) {
      var x = JSON.parse(JSON.stringify(tpl)), b = Comum.proprio(base, municipioId);
      x.naBase = !!b; x.baseTerritorial = b ? b.forca : 0; // fora do conjunto da base, 0 (D56)

    }

    // estadual ou nacional: municípios da base com eleitorado no modelo, mais o agregado regional
    var ag = mp.estadual || erro("maquinaPersonagem.estadual obrigatória em disputa estadual ou nacional");

    var municipiosBase = munis.map(function (m) {
      var r = Maquina.calcularMunicipal({}, (function () {
        var x = municipal(m, ag.municipal); x.semente = e.semente; x.eleicaoId = mo.eleicaoId; x.candidatoId = e.personagem.id; x.municipioId = m;
        x.titularId = e.personagem.partidoId; x.escalaGasto = mo.parametros.escalaGasto; x.sigmaT = mo.parametros.sigmaT; return x;
      })(), null).resultado;
      return { id: m, eleitorado: ag.eleitoradoMunicipios[m], maquinaEfetiva: r.maquinaEfetiva };
    });
    // regional: a base própria entra pelo agregadoRegional, composta com os demais componentes como em 4.5
    var reg = ag.regional || erro("maquinaPersonagem.estadual.regional obrigatório");
    var maqReg = 1 - (1 - e.base.agregadoRegional) * (1 - Comum.real(reg.maquinaSemBase, "regional.maquinaSemBase (calibrar)", 0, 1));
    var a = Maquina.agregarEstadualOuNacional({}, { eleitoradoTotal: mo.eleitorado, municipiosBase: municipiosBase,

  }

  // Disputa do personagem a partir do modelo (D78): opinião dos indicadores do escopo (motor-eleitoral 2 e 4.6).
  function montarDisputa(e, dados, cand) {
    var mo = (Comum.proprio(dados.modelosDisputa, String(cand.ano)) || []).filter(function (m) { return m.disputa.id === cand.disputaId; })[0]
      || erro("modelo de disputa ausente: " + cand.disputaId);
    var cen = JSON.parse(JSON.stringify(mo)), i = e.indicadores[escopoDe(cand.cargo)];
    var c = candidatoBase(e);

      semOpiniao: Math.max(0, i.notoriedade - i.popularidade - i.rejeicao) }; // resíduo de ponto flutuante (D78)

      var antigo = ch.candidato;
      ch.candidato = c.id;
      cen.candidatos = (cen.candidatos || []).filter(function (x) { return x.id !== antigo; });
    }
    if ((cen.candidatos || []).some(function (x) { return x.id === c.id; })) erro("modelo já contém o personagem: " + c.id);
    cen.candidatos = (cen.candidatos || []).concat([c]);

  }

  return Object.freeze({ validarCatalogo: validarCatalogo, ofertas: ofertas, registrar: registrar, montarDisputa: montarDisputa,
    escopoDe: escopoDe, mandatoAtual: mandatoAtual });
})();

/* == NOMEACOES == */
// Cargos de nomeação e desincompatibilização (carreira-e-poder 10.4, 10.5 e 11; eventos-e-risco 6.1; GDD 3; D80).
// Sem RNG e sem número no código: valores por janela, condições e textos vêm do catálogo dados.posicoes (calibrar).
// Capital político não entra (D54); posição partidária não rende Capital de Entrega (D25).
var Nomeacoes = (function () {
  var erro = Comum.erro;
  var ESCOPOS = { municipal: "local", estadual: "estadual", federal: "nacional" }; // escopo da posição -> indicadores e governos
  var EXECUTIVO = { PREFEITO: true, GOVERNADOR: true, PRESIDENTE: true };
  var LEGISLATIVO = { VEREADOR: true, DEPUTADO_ESTADUAL: true, DEPUTADO_DISTRITAL: true, DEPUTADO_FEDERAL: true, SENADOR: true };
  var JANELAS_OFERTA = { C1: true, C3: true }; // anos calmos: montagem dos governos e reforma de meio de mandato (D80)
  // posse de cada governo: ano seguinte à eleição do escopo (GDD 3)
  var GOVERNO = { municipal: "municipal", estadual: "geral", federal: "geral" };

  function validarCatalogo(dados) {
    var ps = dados.posicoes;
    if (!Array.isArray(ps) || ps.length === 0) erro("posicoes: catálogo não vazio");
    var ids = new Set();
    ps.forEach(function (p) {
      var campo = "posição " + Comum.idv(p && p.id, "posicao.id");
      if (ids.has(p.id)) erro(campo + " repetida"); ids.add(p.id);
      ["titulo", "orgao", "risco"].forEach(function (k) { if (typeof p[k] !== "string" || p[k] === "") erro(campo + "." + k + ": texto obrigatório"); });
      if (p.tipo !== "governamental" && p.tipo !== "partidaria") erro(campo + ".tipo: governamental ou partidaria");
      if (!ESCOPOS[p.escopo]) erro(campo + ".escopo: municipal, estadual ou federal");
      Eventos.validarCondicao(p.condicao, campo + ".condicao");

// ---------- utilidades ----------
function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function pct(x) { return (Math.round(x * 1000) / 10).toLocaleString("pt-BR") + "%"; }
function reais(c) { return (c / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
function inteiro(n) { return Number(n).toLocaleString("pt-BR"); }
function faixa(x, t) { for (var i = 0; i < t.length; i++) if (x < t[i][0]) return t[i][1]; }
function diaMes(iso) { var p = iso.split("-"); return p[2] + "/" + p[1]; }
function nomeAlvo(alvo) {
  var ps = alvo.split("."), n = NOMES[ps[ps.length - 1]] || ps[ps.length - 1];
  return ps[0] === "indicadores" ? n + " " + ps[1] : n;
}
function moeda(recurso, q) {
  if (recurso === "caixaPessoal" || recurso === "fundoCampanha") return NOMES[recurso] + ": " + reais(q);
  if (recurso === "capitalEntrega") return "Capacidade de entrega: " + q;
  return (NOMES[recurso] || recurso) + ": " + pct(q);
}
function efeitoChip(alvo, delta) {

  var sobe = delta > 0, ruim = /\.rejeicao$/.test(alvo) ? sobe : !sobe;
  return { cls: ruim ? "chip-bad" : "chip-good", txt: nomeAlvo(alvo) + " tende a " + (sobe ? "subir" : "cair") + (ruim ? " (desfavorável)" : "") };
}
function chip(c) { return '<span class="impact-chip ' + c.cls + '">' + esc(c.txt) + "</span>"; }
function cartaPorId(id) { return DADOS.cartas.filter(function (c) { return c.id === id; })[0]; }
function eventoPorId(id) { return DADOS.eventos.filter(function (x) { return x.id === id; })[0]; }
function mandatoAtual(e) { return e.cargos.mandatos.filter(function (x) { return x.situacao === "exercicio"; })[0] || null; }

function escopoAtual(e) { var m = mandatoAtual(e); return m ? M.Candidatura.escopoDe(m.cargo) : "local"; }
function idade(e) { return M.Datas.idade(M.Datas.ler(e.personagem.dataNascimento), M.Datas.ler(M.Carreira.inicioJanela(e.tempo.ano, e.tempo.janela))); }
function partido(id) { return Object.prototype.hasOwnProperty.call(PARTIDOS, id) ? PARTIDOS[id] : { sigla: id, nome: "Sem cadastro", cor: "#134074" }; }
function semente() {
  var A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", b = new Uint8Array(8), s = "";
  crypto.getRandomValues(b); // só a sugestão de semente; o motor nunca sorteia fora dos fluxos (D79)
  for (var i = 0; i < 8; i++) s += (i === 4 ? "-" : "") + A[b[i] % A.length];
  return "v1-" + s;
}
function clima(e) {
  var i = e.indicadores[escopoAtual(e)];
  if (i.rejeicao >= CLIMA.hostilRejeicao && i.rejeicao >= i.popularidade) return { chave: "hostil", rotulo: "Pressão nas ruas", cls: "rubric-hostil" };
  if (i.popularidade >= CLIMA.popularPopularidade && i.popularidade > i.rejeicao) return { chave: "popular", rotulo: "Onda favorável", cls: "rubric-popular" };
  return { chave: "discreta", rotulo: "Atenção discreta", cls: "rubric-discreta" };
}

// ---------- plano 0: céu do cerrado (WebGL com recurso 2D; estático com movimento reduzido) ----------
var ceu = (function () {
  var canvas = document.getElementById("sky-gl");
  var TEMAS = { manha: { top: [0.07, 0.19, 0.38], bot: [0.29, 0.53, 0.76], glow: [0.96, 0.82, 0.52] },
    solPleno: { top: [0.05, 0.24, 0.48], bot: [0.22, 0.58, 0.84], glow: [0.98, 0.90, 0.68] },
    crepusculo: { top: [0.16, 0.10, 0.24], bot: [0.62, 0.26, 0.22], glow: [0.96, 0.58, 0.26] },
    noite: { top: [0.04, 0.08, 0.18], bot: [0.11, 0.22, 0.38], glow: [0.85, 0.68, 0.36] } };
  var atual = JSON.parse(JSON.stringify(TEMAS.manha)), alvo = TEMAS.manha, rodando = false, rolagem = 0, desenhar;
  var gl = null;
  try { gl = canvas.getContext("webgl2") || canvas.getContext("webgl"); } catch (x) { gl = null; }
  function ajustar() {
    var w = canvas.clientWidth || 360, h = canvas.clientHeight || 166;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; if (gl) gl.viewport(0, 0, w, h); }
  }
  if (gl) {
    var vs = "attribute vec2 a_pos; varying vec2 v_uv; void main(){ v_uv = a_pos * 0.5 + 0.5; gl_Position = vec4(a_pos, 0.0, 1.0); }";
    var fs = "precision mediump float; varying vec2 v_uv; uniform vec3 u_top; uniform vec3 u_bot; uniform vec3 u_glow; uniform float u_time; uniform float u_scroll;" +
      "float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }" +
      "void main(){ float y = clamp(v_uv.y + u_scroll * 0.08, 0.0, 1.0); vec3 col = mix(u_bot, u_top, pow(y, 0.85));" +
      " float sunDist = distance(v_uv, vec2(0.5, 0.24 - u_scroll * 0.05)); col += u_glow * smoothstep(0.58, 0.0, sunDist) * 0.34;" +
      " float wave = sin(v_uv.x * 6.0 + u_time * 0.25) * 0.015; col += vec3(0.03, 0.04, 0.05) * smoothstep(0.55, 0.35, abs(v_uv.y - (0.48 + wave)));" +
      " float grain = (hash(v_uv * 240.0 + fract(u_time * 0.05)) - 0.5) * 0.028; gl_FragColor = vec4(clamp(col + grain, 0.0, 1.0), 1.0); }";
    var compilar = function (t, src) { var s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    var prog = gl.createProgram();
    gl.attachShader(prog, compilar(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, compilar(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) gl = null;
    else {
      gl.useProgram(prog);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      var loc = gl.getAttribLocation(prog, "a_pos"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      var u = {}; ["u_top", "u_bot", "u_glow", "u_time", "u_scroll"].forEach(function (n) { u[n] = gl.getUniformLocation(prog, n); });
      desenhar = function (t) {
        ajustar();
        gl.uniform3fv(u.u_top, atual.top); gl.uniform3fv(u.u_bot, atual.bot); gl.uniform3fv(u.u_glow, atual.glow);
        gl.uniform1f(u.u_time, reduzir() ? 0 : t * 0.001); gl.uniform1f(u.u_scroll, reduzir() ? 0 : rolagem);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      };
    }
  }
  if (!gl) {
    var c2 = canvas.getContext("2d");
    desenhar = function () {
      ajustar(); if (!c2) return;
      var g = c2.createLinearGradient(0, 0, 0, canvas.height), rgb = function (v) { return "rgb(" + v.map(function (x) { return Math.round(x * 255); }).join(",") + ")"; };
      g.addColorStop(0, rgb(atual.top)); g.addColorStop(1, rgb(atual.bot)); c2.fillStyle = g; c2.fillRect(0, 0, canvas.width, canvas.height);
    };
  }
  function quadro(t) {
    var k = reduzir() ? 1 : 0.08, falta = 0;
    ["top", "bot", "glow"].forEach(function (n) { for (var i = 0; i < 3; i++) { atual[n][i] += (alvo[n][i] - atual[n][i]) * k; falta += Math.abs(alvo[n][i] - atual[n][i]); } });
    desenhar(t);
    // com movimento reduzido ou aba oculta, o céu para; sem shader animado, para quando chega ao tema
    if (!reduzir() && !document.hidden && (gl || falta > 0.002)) requestAnimationFrame(quadro); else rodando = false;
  }
  function animar() { if (!rodando) { rodando = true; requestAnimationFrame(quadro); } }
  document.addEventListener("visibilitychange", animar);
  window.addEventListener("scroll", function () {
    var max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    rolagem = Math.min(1, Math.max(0, window.scrollY / max));

    far.style.transform = r ? "none" : "translateY(" + (rolagem * 8).toFixed(1) + "px)";
    mid.style.transform = r ? "none" : "translateY(" + (rolagem * 4).toFixed(1) + "px)";
  }, { passive: true });
  return { tema: function (n) { alvo = TEMAS[n] || TEMAS.manha; animar(); }, animar: animar };
})();

// ---------- motor ----------
function previa() { return M.Carreira.previa(app.estado, DADOS, { opcoes: OPCOES, decisoes: app.decisoes }); }
function faseAtual() {
  var e = app.estado;
  if (app.resumo) return { nome: "resumo" };
  if (!M.Carreira.ehManual(e)) return { nome: "automatica" };
  var p = previa();
  if (p.compromissos.length) return { nome: "compromissos", lista: p.compromissos };
  if (p.eventos.length) return { nome: "eventos", lista: p.eventos };
  if (p.desincompatibilizacao) return { nome: "desincompatibilizacao", pend: p.desincompatibilizacao };
  if (p.nomeacoes) return { nome: "nomeacoes", lista: p.nomeacoes };
  if (p.candidaturas) return { nome: "candidatura", lista: p.candidaturas };
  return { nome: "mao", mao: p.mao };
}
function textoOcorrencia(o, e) {
  switch (o.tipo) {
    case "posse": return "Posse no mandato.";
    case "fimMandato": return "Fim do mandato.";
    case "compromisso": return "Compromisso " + (o.desfecho === "cumprido" ? "cumprido." : "rompido.");
    case "evento": var ev = eventoPorId(o.eventoId), op = ev && ev.opcoes.filter(function (x) { return x.id === o.opcaoId; })[0];
      return (ev ? ev.titulo : o.eventoId) + (op && ev.opcoes.length > 1 ? ": " + op.texto + "." : ".");
    case "carta": var c = cartaPorId(o.id);
      return (c ? c.titulo : o.id) + (c && c.segura ? "." : o.sucesso ? ": saiu como esperado." : ": não saiu como esperado.") + (o.risco ? " O risco se confirmou." : "");
    case "candidatura": return "Candidatura registrada na convenção.";
    case "naoConcorreu": return "Decidiu não concorrer neste ano.";
    case "eleicao": var h = e.historico.filter(function (x) { return x.tipo === "eleicao" && x.disputaId === o.disputaId; }).slice(-1)[0];
      return "Eleição: " + (o.personagemEleito ? "eleito" : "não eleito") + (h && h.votos !== null ? ", " + inteiro(h.votos) + " votos (" + h.posicao + "º lugar)." : ".");
    case "arquivamento": return "Investigação arquivada por prazo.";
    case "nomeacaoAceita": return "Nomeação aceita: " + (posicaoPorId(o.posicaoId) || { titulo: o.posicaoId }).titulo + ".";
    case "nomeacaoRecusada": return "Convites de nomeação recusados.";
    case "nomeacaoEncerrada": return "Saída do cargo de nomeação" + ({ voluntaria: " por decisão própria.", trocaDeGoverno: " com a posse do novo governo.", evento: " depois da crise.", desincompatibilizacao: " para disputar a eleição." }[o.motivo] || ".");
    case "desincompatibilizacao": return o.decisao === "sair" ? (o.alvo === "executivo" ? "Renúncia ao mandato para disputar outro cargo." : "Saída do cargo para disputar a eleição.") : "Decidiu permanecer no cargo neste ano eleitoral.";
    default: return null;
  }
}
function avancarUma(decisoes) {
  var t = app.estado.tempo, r = M.Carreira.avancar(app.estado, DADOS, { opcoes: OPCOES, decisoes: decisoes });
  app.estado = r.resultado.estado;
  return { rotulo: t.ano + ", janela " + t.janela + (decisoes ? "" : " (automática)"),
    textos: r.resultado.ocorrencias.map(function (o) { return textoOcorrencia(o, app.estado); }).filter(Boolean) };
}
function executar(decisoes) {
  try {
    var itens = [avancarUma(decisoes)], n = 0;
    while (!M.Carreira.ehManual(app.estado) && n++ < LIMITE_LOTE) itens.push(avancarUma(undefined));
    salvar();
    app.resumo = itens; app.decisoes = {}; app.sel = {}; app.deixar = false; app.erro = null;
  } catch (x) { app.erro = "Erro do motor: " + x.message; }
  render(true);
}

// ---------- plano 1: painel de situação (até 6 números, GDD 5) ----------
function metricas(e) {
  var s = escopoAtual(e), i = e.indicadores[s], b = e.bolsos, t = e.tempo, lista = [
    { id: "hud-not", rotulo: "Notoriedade", v: i.notoriedade, f: pct }, { id: "hud-pop", rotulo: "Popularidade", v: i.popularidade, f: pct },
    { id: "hud-rej", rotulo: "Rejeição", v: i.rejeicao, f: pct }, { id: "hud-cai", rotulo: "Caixa Pessoal", v: b.caixaPessoal, f: reais }];
  if (M.Carreira.tipoAno(t.ano) === "eleitoral" && CAMPANHA[t.janela]) lista.push({ id: "hud-fun", rotulo: "Fundo de Campanha", v: b.fundoCampanha, f: reais });
  var n = nomeacaoAtiva(e);
  if (mandatoAtual(e) || (n && n.tipo === "governamental")) lista.push({ id: "hud-ent", rotulo: "Capacidade de entrega", v: b.capitalEntrega, f: inteiro });
  return { escopo: s, ind: i, lista: lista };
}
function renderHud() {
  var hud = document.getElementById("hud"), e = app.estado;
  hud.hidden = !(app.tela === "jogo" && app.aba === "janela");
  if (hud.hidden) return;
  var m = metricas(e), t = e.tempo, man = mandatoAtual(e), pa = partido(e.personagem.partidoId), nom = nomeacaoAtiva(e);
  var sem = Math.max(0, m.ind.notoriedade - m.ind.popularidade - m.ind.rejeicao);
  hud.innerHTML = '<div class="hud-context-row"><span class="hud-turn">' + t.ano + ", janela " + esc(t.janela) + ", desde " + diaMes(M.Carreira.inicioJanela(t.ano, t.janela)) +
    (M.Carreira.ehManual(e) ? "" : " (automática)") + '</span><span class="hud-role">' + esc(nom ? (posicaoPorId(nom.posicaoId) || { titulo: nom.posicaoId }).titulo : man ? CARGOS[man.cargo] : "Sem cargo") + ", " + esc(pa.sigla) + ", escopo " + esc(m.escopo) + "</span></div>" +
    '<dl class="hud-grid-metrics' + (m.lista.length > 4 ? " has-extra" : "") + '">' + m.lista.map(function (x) {
      return '<div class="metric-cell"><dt class="metric-label">' + esc(x.rotulo) + '</dt><dd class="metric-val" id="' + x.id + '">' + esc(x.f(x.v)) + "</dd></div>"; }).join("") + "</dl>" +
    '<div class="opinion-bar" aria-hidden="true"><span class="op-seg-pop" style="width:' + (m.ind.popularidade * 100).toFixed(1) + '%"></span><span class="op-seg-neu" style="width:' +
    (sem * 100).toFixed(1) + '%"></span><span class="op-seg-rej" style="width:' + (m.ind.rejeicao * 100).toFixed(1) + '%"></span></div>' +
    '<p class="hud-legend">Barra: popularidade, sem opinião formada e rejeição sobre todo o eleitorado do escopo.</p>';
  var antes = app.hudAnterior; app.hudAnterior = {};
  m.lista.forEach(function (x) { app.hudAnterior[x.id] = x.v; });
  if (!antes || reduzir()) return;
  var ini = performance.now();
  (function passo(agora) {
    var k = Math.min(1, (agora - ini) / 360), q = 1 - Math.pow(1 - k, 3);
    m.lista.forEach(function (x) { var el = document.getElementById(x.id), a = antes[x.id];
      if (el && a !== undefined && a !== x.v) { var v = a + (x.v - a) * q; el.textContent = x.f(x.f === pct ? v : Math.round(v)); } });
    if (k < 1) requestAnimationFrame(passo);
  })(ini);
}

function telaCompromissos(lista) {

    return '<article class="dossier-card">' + cabecalho("Compromisso com " + c.ator, c.objeto.charAt(0).toUpperCase() + c.objeto.slice(1), "Vence agora", false, 2) +

    Object.keys(RITMOS).map(function (r) { return '<option value="' + r + '"' + (v.ritmo === r ? " selected" : "") + ">" + RITMOS[r] + "</option>"; }).join("") + "</select></div>" +
    '<div class="field-group"><label class="field-label" for="semente">Semente da partida</label><input class="field-input" id="semente" name="semente" autocomplete="off" value="' + esc(v.semente) + '"></div>' +
    '<p class="fiction-notice" role="note">Origem, estado, município, partido e dificuldade estão fixos no cenário de exemplo até a entrada dos dados reais.</p>' +
    '<div class="btn-stack"><button type="submit" class="btn btn-primary">Começar carreira</button>' + botao("voltar-inicio", "Voltar") + "</div></form></article>";
}

// ---------- montagem da tela ----------
function render(mudouFase) {
  var e = app.estado, emJogo = app.tela === "jogo";
  var palco = document.getElementById("sky-stage"), desk = document.getElementById("conteudo"), abas = document.getElementById("abas"), html;
  try {
    if (app.tela === "inicio") html = telaInicio();
    else if (app.tela === "criacao") html = telaCriacao();
    else html = ({ janela: telaJanela, carreira: telaCarreira, partido: telaPartido, indicadores: telaIndicadores, menu: telaMenu })[app.aba]();
  } catch (x) { html = '<article class="dossier-card"><h1 class="dossier-title" tabindex="-1">Erro</h1><p class="erro">' + esc(x.message) + "</p></article>"; }
  palco.classList.toggle("is-hero", !emJogo); desk.classList.toggle("is-hero-desk", !emJogo);
  var c = emJogo ? clima(e) : { chave: "discreta" };
  palco.setAttribute("data-street", c.chave);
  var fn = app.faseNome, t = e && e.tempo;
  ceu.tema(!emJogo ? "manha" : fn === "eventos" || c.chave === "hostil" ? "crepusculo" : t.janela === "J3" ? "solPleno" : t.janela === "J5" || t.janela === "J6" ? "noite" : "manha");
  abas.hidden = !emJogo;
  Array.prototype.forEach.call(abas.querySelectorAll("[data-aba]"), function (b) { b.setAttribute("aria-selected", String(b.dataset.aba === app.aba)); b.tabIndex = b.dataset.aba === app.aba ? 0 : -1; });
  renderHud();
  desk.innerHTML = (app.erro ? '<p class="erro" role="alert">' + esc(app.erro) + "</p>" : "") + '<div class="fase' + (mudouFase && !reduzir() ? " phase-enter" : "") + '">' + html + "</div>";
  Array.prototype.forEach.call(desk.querySelectorAll("[data-radiogroup]"), function (g) { sincronizarGrupo(g.dataset.radiogroup); });
  var chave = app.tela + app.aba + (fn || "") + (t ? t.ano + t.janela : "");
  if (mudouFase || chave !== app.ultimaFase) { var h = desk.querySelector("h1.dossier-title"); if (h) h.focus({ preventScroll: false }); }
  app.ultimaFase = chave;
}
// seleção no lugar: só classes e atributos mudam (sem flash e sem perder o foco)
function sincronizarGrupo(grupo) {
  var cards = Array.prototype.filter.call(document.querySelectorAll("[data-grupo]"), function (el) { return el.dataset.grupo === grupo; });
  var algum = cards.some(function (el) { return el.dataset.valor === app.sel[grupo]; });
  cards.forEach(function (el, i) {
    var ativo = el.dataset.valor === app.sel[grupo], off = el.getAttribute("aria-disabled") === "true";
    el.classList.toggle("is-selected", ativo); el.setAttribute("aria-checked", String(ativo));
    el.tabIndex = ativo || (!algum && i === cards.findIndex(function (x) { return x.getAttribute("aria-disabled") !== "true"; })) ? 0 : -1;
    var fita = el.querySelector(".selected-ribbon");
    if (fita) { fita.children[0].textContent = ativo ? el.dataset.rotuloSim : off ? "Indisponível" : el.dataset.rotuloNao; fita.children[1].textContent = ativo ? "Ativa" : ""; }
  });
  var conf = document.querySelector("[data-acao=confirmar]");
  if (conf) conf.disabled = !conf.dataset.grupos.split(" ").every(function (g) { return app.sel[g] !== undefined; });
}
function selecionar(el) {
  if (el.getAttribute("aria-disabled") === "true") return;
  app.sel[el.dataset.grupo] = el.dataset.valor; sincronizarGrupo(el.dataset.grupo);
}
function carimbo(sub, depois) {
  var ov = document.getElementById("carimbo");
  if (reduzir()) { depois(); return; }
  document.getElementById("carimbo-sub").textContent = sub;
  ov.classList.add("is-visible");
  setTimeout(function () { ov.classList.remove("is-visible"); depois(); }, 420);
}

// ---------- gaveta de importação ----------
var gaveta = document.getElementById("gaveta-import"), abridor = null;
function abrirGaveta(origem) {
  abridor = origem; app.importacao = {}; desenharGaveta();
  gaveta.hidden = false; requestAnimationFrame(function () { gaveta.classList.add("is-open"); });
  document.getElementById("codigo-import").focus();
}
function fecharGaveta() { gaveta.classList.remove("is-open"); gaveta.hidden = true; if (abridor && document.body.contains(abridor)) abridor.focus(); }
function desenharGaveta() {
  var imp = app.importacao || {};
  document.getElementById("gaveta-corpo").innerHTML = '<div class="field-group"><label class="field-label" for="codigo-import">Cole o código iniciado por DG1:</label>' +
    '<textarea class="field-textarea" id="codigo-import">' + esc(imp.codigo || "") + "</textarea></div>" +
    (imp.pedeFiliacao ? '<div class="field-group"><label class="field-label" for="filiacao">Data de filiação (o save antigo não a guarda)</label><input class="field-input" id="filiacao" type="date"></div>' : "") +
    (imp.erro ? '<p class="erro" role="alert">' + esc(imp.erro) + "</p>" : "") + '<div class="btn-stack" style="margin-top:10px">' + botao("importar", "Carregar partida", "btn-primary") + "</div>";
}
gaveta.addEventListener("click", function (ev) { if (ev.target === gaveta) fecharGaveta(); });
gaveta.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape") { fecharGaveta(); return; }
  if (ev.key !== "Tab") return; // foco preso na gaveta enquanto aberta
  var f = gaveta.querySelectorAll("button, textarea, input"), a = f[0], z = f[f.length - 1];
  if (ev.shiftKey && document.activeElement === a) { ev.preventDefault(); z.focus(); } else if (!ev.shiftKey && document.activeElement === z) { ev.preventDefault(); a.focus(); }
});

// ---------- ações ----------
function iniciarJogo(estado) { app.estado = estado; app.tela = "jogo"; app.aba = "janela"; app.decisoes = {}; app.sel = {}; app.resumo = null; app.erro = null; app.exportado = null; app.hudAnterior = null; }
function confirmarFase(b) {
  var fase = b.dataset.fase, grupos = b.dataset.grupos.split(" ");
  if (fase === "compromissos") { app.decisoes.compromissos = app.decisoes.compromissos || {}; grupos.forEach(function (g) { app.decisoes.compromissos[g.slice(2)] = app.sel[g]; delete app.sel[g]; }); render(true); }
  else if (fase === "eventos") { app.decisoes.eventos = app.decisoes.eventos || {}; grupos.forEach(function (g) { app.decisoes.eventos[g.slice(2)] = app.sel[g]; delete app.sel[g]; }); render(true); }
  else if (fase === "candidatura") { app.decisoes.candidatura = app.sel.cand; delete app.sel.cand; render(true); }
  else if (fase === "nomeacoes") { app.decisoes.nomeacao = app.sel.nom; delete app.sel.nom; render(true); }
  else if (fase === "desincompatibilizacao") { app.decisoes.desincompatibilizacao = app.sel.des; delete app.sel.des; render(true); }
  else {
    var d = JSON.parse(JSON.stringify(app.decisoes)), t = app.estado.tempo; d.carta = app.sel.carta; b.disabled = true;
    if (app.deixar) d.deixarNomeacao = true;
    carimbo("Período " + t.janela + " de " + t.ano + " concluído", function () { executar(d); });
  }
}
var ACOES = {
  "criar-tela": function () { app.tela = "criacao"; app.form = null; app.erro = null; render(true); },
  "voltar-inicio": function () { app.tela = "inicio"; app.erro = null; render(true); },
  "continuar-salvo": function () { try { iniciarJogo(M.Save.ler(lerSalvo())); salvar(); } catch (x) { app.erro = "Save local ilegível: " + x.message; } render(true); },
  "abrir-import": function (b) { abrirGaveta(b); },
  "fechar-import": function () { fecharGaveta(); },
  "importar": function () {
    var codigo = document.getElementById("codigo-import").value, f = document.getElementById("filiacao");
    try { iniciarJogo(M.Save.importar(codigo, undefined, f && f.value ? { dataFiliacao: f.value } : undefined)); salvar(); fecharGaveta(); render(true); }
    catch (x) { app.importacao = { codigo: codigo, pedeFiliacao: /dataFiliacao/.test(x.message), erro: "Não foi possível importar: " + x.message }; desenharGaveta(); document.getElementById("codigo-import").focus(); }
  },
  "confirmar": confirmarFase,
  "avancar": function () { executar(undefined); },
  "continuar": function () { app.resumo = null; render(true); },
  "exportar": function () { app.exportado = M.Save.exportar(app.estado); carimbo("Código do save gerado", function () { render(false); var t = document.getElementById("codigo-export"); if (t) t.focus(); }); },
  "movimento": function () { pref.reduzirMovimento = !pref.reduzirMovimento; salvarPref(); document.body.classList.toggle("reduce-motion", pref.reduzirMovimento); ceu.animar(); render(false); },
  "nova": function () { if (app.confirmarNova) { app.confirmarNova = false; app.estado = null; app.tela = "criacao"; app.form = null; render(true); } else { app.confirmarNova = true; render(false); } }
};
document.addEventListener("click", function (ev) {
  var r = ev.target.closest("[data-grupo]");
  if (r) { selecionar(r); return; }
  var dx = ev.target.closest("[data-deixar]");
  if (dx) { app.deixar = !app.deixar; dx.setAttribute("aria-checked", String(app.deixar)); return; }
  var a = ev.target.closest("[data-ambicao]");
  if (a) { var on = a.getAttribute("aria-checked") !== "true"; a.setAttribute("aria-checked", String(on)); return; }
  var t = ev.target.closest("[data-aba]");
  if (t) { app.aba = t.dataset.aba; app.confirmarNova = false; render(true); return; }
  var b = ev.target.closest("button[data-acao]");
  if (b && ACOES[b.dataset.acao]) ACOES[b.dataset.acao](b);
});
document.addEventListener("keydown", function (ev) {
  var r = ev.target.closest && ev.target.closest("[data-grupo], [data-ambicao], [data-deixar]");
  if (r && (ev.key === " " || ev.key === "Enter")) { ev.preventDefault(); r.click(); return; }
  // setas no grupo de rádio (padrão ARIA): move o foco e seleciona
  if (r && r.dataset.grupo && /^Arrow(Up|Down|Left|Right)$/.test(ev.key)) {
    ev.preventDefault();
    var cards = Array.prototype.filter.call(document.querySelectorAll("[data-grupo]"), function (x) { return x.dataset.grupo === r.dataset.grupo && x.getAttribute("aria-disabled") !== "true"; });
    var i = cards.indexOf(r), n = cards[(i + (/Up|Left/.test(ev.key) ? -1 : 1) + cards.length) % cards.length];
    n.focus(); selecionar(n); return;
  }
  var tab = ev.target.closest && ev.target.closest("[data-aba]");
  if (tab && /^Arrow(Left|Right)$/.test(ev.key)) {
    var ts = Array.prototype.slice.call(document.querySelectorAll("[data-aba]")), j = ts.indexOf(tab);
    ts[(j + (ev.key === "ArrowLeft" ? -1 : 1) + ts.length) % ts.length].focus();
  }
});
document.addEventListener("change", function (ev) {
  if (ev.target.dataset.acao !== "ritmo") return;
  try { app.estado = M.Carreira.mudarRitmo(app.estado, ev.target.value); salvar(); app.erro = null; } catch (x) { app.erro = x.message; }
  render(false);
});
document.addEventListener("submit", function (ev) {
  if (ev.target.id !== "criacao") return;
  ev.preventDefault();
  var f = ev.target, nome = f.nome.value.trim(), dn = f.nascimento.value;
  var amb = Array.prototype.filter.call(f.querySelectorAll("[data-ambicao]"), function (x) { return x.getAttribute("aria-checked") === "true"; }).map(function (x) { return x.dataset.ambicao; });
  app.form = { nome: f.nome.value, nascimento: dn, ambicao: amb, ritmo: f.ritmo.value, semente: f.semente.value };
  try {
    if (!nome) throw new Error("Informe um nome fictício.");
    var anos = M.Datas.idade(M.Datas.ler(dn, "data de nascimento"), M.Datas.ler(INICIO_CARREIRA));
    if (anos < 18 || anos > 60) throw new Error("A idade em 01/01/2026 precisa estar entre 18 e 60 anos.");
    var ini = JSON.parse(JSON.stringify(BRUTO.inicio));
    ini.personagem.nome = nome; ini.personagem.dataNascimento = dn; ini.personagem.ambicao = amb;
    var e = M.Carreira.criar({}, { semente: f.semente.value.trim() || semente(), gameVersion: BRUTO.gameVersion, ritmo: f.ritmo.value, inicio: ini }, null).resultado;
    app.form = null; iniciarJogo(e); salvar();
  } catch (x) { app.erro = x.message; }
  render(true);
});
render(false);
})();
</script>
</body>
</html>
